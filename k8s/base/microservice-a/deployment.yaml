apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-a
  labels:
    app: microservice-a
    team: paymentbox-core
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-a
  template:
    metadata:
      labels:
        app: microservice-a
        team: paymentbox-core
    spec:
      containers:
        - name: microservice-a
          image: ghcr.io/optaresolutions/mx-poc-paymentapp/microservice-a
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: att-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: att-db-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: att-db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: att-db-secret
                  key: password
            - name: CUSTOMER_PROFILE_URL
              value: "http://microservice-b:8081"
            - name: MOCK_OPERADOR_URL
              value: "http://mock-operador:4010"
            - name: MOCK_RECIBO_URL
              value: "http://mock-recibo:4010"
            # PoC TRA-36 T2 (2026-05-14): marcador reproducible en runtime (kubectl describe pod)
            - name: POC_MS_A_DEPLOY_MARKER
              value: "TRA-36-T2-2026-05-14"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
