apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Produção ──────────────────────────────────────────────────────────────────
# Branch: main  |  Deploy: via pipeline-integration.yml (promoção manual uat→main)
# ArgoCD app: att-paymentbox-prod

namespace: att-paymentbox-prod

commonLabels:
  environment: prod
  managed-by: argocd

resources:
  - ../../base/microservice-a
  - ../../base/microservice-b
  - ../../base/ui-paymentbox

# Tags promovidas automaticamente pelo pipeline-integration.yml (uat→main)
images:
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/microservice-a
    newTag: "prod-19579ac"
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/microservice-b
    newTag: "prod-0b955cb"
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/ui-paymentbox
    newTag: "env-e-0000000"
