apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Ambiente U — UAT ─────────────────────────────────────────────────────────
# Branch: uat  |  Deploy: via pipeline-integration.yml (promoção manual qa→uat)
# ArgoCD app: att-paymentbox-env-u

namespace: att-paymentbox-env-u

commonLabels:
  environment: env-u
  managed-by: argocd

resources:
  - ../../base/microservice-a
  - ../../base/microservice-b
  - ../../base/ui-paymentbox

# Tags promovidas automaticamente pelo pipeline-integration.yml (qa→uat)
images:
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/microservice-a
    newTag: "env-e-0000000"
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/microservice-b
    newTag: "env-e-0000000"
  - name: ghcr.io/optaresolutions/mx-poc-paymentapp/ui-paymentbox
    newTag: "env-e-0000000"
