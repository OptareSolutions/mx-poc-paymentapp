name: "API Contract — Quality Gates · Breaking Changes OpenAPI"

# ------------------------------------------------------------------------------
# Detección de breaking changes en especificaciones OpenAPI/Swagger.
#
# Compara la especificación OpenAPI de la rama actual contra la rama base
# (target branch) usando oasdiff. Bloquea el pipeline si detecta cambios
# incompatibles (breaking changes).
#
# Breaking changes detectados:
#   - Eliminación de endpoints o métodos HTTP
#   - Campos requeridos añadidos al request body
#   - Renombrado o eliminación de campos en response
#   - Cambio de tipo de datos en campos existentes
#   - Eliminación de valores de enum existentes
#   - Cambio de parámetros obligatorios
#
# Herramienta: oasdiff (https://github.com/tufin/oasdiff)
# Referencia:  docs/openapi-baseline.yaml en cada microservicio
# ------------------------------------------------------------------------------

on:
  pull_request:
    # Detecta breaking changes en contratos OpenAPI antes de cualquier merge
    branches: [E, A, F, PRODUCCION]
    paths:
      - "microservice-a/docs/openapi*.yaml"
      - "microservice-b/docs/openapi*.yaml"
      - "microservice-a/src/main/java/**"
      - "microservice-b/src/main/java/**"
  push:
    # Post-merge en QA y Preprod: re-valida contratos tras integración
    branches: [A, F]
    paths:
      - "microservice-a/docs/openapi*.yaml"
      - "microservice-b/docs/openapi*.yaml"
  workflow_dispatch:
    inputs:
      service:
        description: "Servicio a verificar"
        required: false
        type: choice
        default: "all"
        options: [all, microservice-a, microservice-b]

# Evitar ejecuciones concurrentes sobre la misma rama
concurrency:
  group: openapi-contract-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # Para comentar resultados en PRs

jobs:
  # ── Job: Detectar qué servicios tienen cambios ──────────────────────────────
  detect-changes:
    name: "1 · Build · Detectar servicios con cambios"
    runs-on: ubuntu-latest
    outputs:
      check-msvc-a: ${{ steps.filter.outputs.microservice-a }}
      check-msvc-b: ${{ steps.filter.outputs.microservice-b }}

    steps:
      - name: "Build · Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Build · Detectar servicios con cambios"
        id: filter
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          echo "Comparando con rama base: ${BASE_REF}"

          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true

          # Verificar cambios en microservice-a
          if git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | \
              grep -qE "^microservice-a/" ; then
            echo "microservice-a=true" >> $GITHUB_OUTPUT
            echo "✅ Cambios detectados en microservice-a"
          else
            echo "microservice-a=false" >> $GITHUB_OUTPUT
            echo "⏭️  Sin cambios en microservice-a"
          fi

          # Verificar cambios en microservice-b
          if git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | \
              grep -qE "^microservice-b/" ; then
            echo "microservice-b=true" >> $GITHUB_OUTPUT
            echo "✅ Cambios detectados en microservice-b"
          else
            echo "microservice-b=false" >> $GITHUB_OUTPUT
            echo "⏭️  Sin cambios en microservice-b"
          fi

          # workflow_dispatch: forzar verificación del servicio seleccionado
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SVC="${{ inputs.service }}"
            if [ "$SVC" = "all" ] || [ "$SVC" = "microservice-a" ]; then
              echo "microservice-a=true" >> $GITHUB_OUTPUT
            fi
            if [ "$SVC" = "all" ] || [ "$SVC" = "microservice-b" ]; then
              echo "microservice-b=true" >> $GITHUB_OUTPUT
            fi
          fi

  # ── Job: Verificar microservice-a ───────────────────────────────────────────
  check-microservice-a:
    name: "3 · Quality Gates · Breaking Changes microservice-a"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.check-msvc-a == 'true'

    steps:
      - name: "Quality Gates · Checkout rama actual (revision)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Quality Gates · Preparar spec actual (revision)"
        id: current-spec
        run: |
          SPEC_STATIC="microservice-a/docs/openapi.yaml"
          SPEC_BASELINE="microservice-a/docs/openapi-baseline.yaml"

          if [ -f "${SPEC_STATIC}" ]; then
            cp "${SPEC_STATIC}" /tmp/revision-spec.yaml
            echo "Usando spec estática: ${SPEC_STATIC}"
            echo "found=true" >> $GITHUB_OUTPUT
          elif [ -f "${SPEC_BASELINE}" ]; then
            cp "${SPEC_BASELINE}" /tmp/revision-spec.yaml
            echo "Usando spec baseline como revisión: ${SPEC_BASELINE}"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No se encontró spec para microservice-a."
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: "Quality Gates · Obtener spec baseline (rama base)"
        id: base-spec
        if: steps.current-spec.outputs.found == 'true'
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "${BASE_REF}" --depth=1

          # Intentar obtener spec dinámica (openapi.yaml) desde rama base
          if git show "origin/${BASE_REF}:microservice-a/docs/openapi.yaml" \
              > /tmp/base-spec.yaml 2>/dev/null; then
            echo "✅ Baseline obtenida: microservice-a/docs/openapi.yaml @ origin/${BASE_REF}"
            echo "found=true" >> $GITHUB_OUTPUT
          # Fallback: usar openapi-baseline.yaml desde rama base
          elif git show "origin/${BASE_REF}:microservice-a/docs/openapi-baseline.yaml" \
              > /tmp/base-spec.yaml 2>/dev/null; then
            echo "✅ Baseline obtenida: microservice-a/docs/openapi-baseline.yaml @ origin/${BASE_REF}"
            echo "found=true" >> $GITHUB_OUTPUT
          # Fallback: usar baseline local del repo actual
          elif [ -f "microservice-a/docs/openapi-baseline.yaml" ]; then
            cp "microservice-a/docs/openapi-baseline.yaml" /tmp/base-spec.yaml
            echo "⚠️ Usando baseline local (origin/${BASE_REF} no tiene spec)"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No se encontró spec baseline para microservice-a"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: "Quality Gates · Instalar oasdiff"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        run: |
          OASDIFF_VERSION="v1.10.20"
          wget -qO /tmp/oasdiff.tar.gz \
            "https://github.com/tufin/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: "Quality Gates · Analizar diferencias (diff completo)"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        run: |
          echo "====== DIFERENCIAS OPENAPI — microservice-a ======"
          oasdiff diff /tmp/base-spec.yaml /tmp/revision-spec.yaml \
            --format text 2>&1 | tee /tmp/diff-msvc-a.txt || true
          echo "=================================================="

      - name: "Quality Gates · Detectar breaking changes — microservice-a"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        id: breaking
        run: |
          echo "====== BREAKING CHANGES — microservice-a ======"
          set +e
          oasdiff breaking /tmp/base-spec.yaml /tmp/revision-spec.yaml \
            --format text 2>&1 | tee /tmp/breaking-msvc-a.txt
          EXIT_CODE=$?
          set -e
          echo "================================================"

          BREAKING_LINES=$(grep -c . /tmp/breaking-msvc-a.txt 2>/dev/null || echo 0)

          if [ $EXIT_CODE -ne 0 ] || [ "$BREAKING_LINES" -gt 0 ]; then
            echo "breaking_found=true" >> $GITHUB_OUTPUT
            echo "breaking_count=${BREAKING_LINES}" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Se detectaron ${BREAKING_LINES} breaking change(s) en microservice-a"
          else
            echo "breaking_found=false" >> $GITHUB_OUTPUT
            echo "breaking_count=0" >> $GITHUB_OUTPUT
            echo "✅ Sin breaking changes en microservice-a"
          fi

      - name: "Quality Gates · Subir reporte de breaking changes"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-breaking-changes-microservice-a-${{ github.run_id }}
          path: |
            /tmp/breaking-msvc-a.txt
            /tmp/diff-msvc-a.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: "Quality Gates · Bloquear pipeline por breaking changes"
        if: steps.breaking.outputs.breaking_found == 'true'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ❌  PIPELINE BLOQUEADO — Breaking Changes Detectados        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Servicio: microservice-a                                    ║"
          echo "║  Breaking changes: ${{ steps.breaking.outputs.breaking_count }}                                           ║"
          echo "║                                                              ║"
          echo "║  Acciones requeridas:                                        ║"
          echo "║  1. Revisar el reporte adjunto (Artifacts)                   ║"
          echo "║  2. Hacer los cambios compatibles hacia atrás (non-breaking) ║"
          echo "║  3. O versionar la API con /v2/ manteniendo /v1/             ║"
          echo "║  4. O obtener aprobación explícita del equipo consumidor     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          cat /tmp/breaking-msvc-a.txt
          exit 1

  # ── Job: Verificar microservice-b ───────────────────────────────────────────
  check-microservice-b:
    name: "3 · Quality Gates · Breaking Changes microservice-b"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.check-msvc-b == 'true'

    steps:
      - name: "Quality Gates · Checkout rama actual (revision)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Quality Gates · Preparar spec actual (revision)"
        id: current-spec
        run: |
          SPEC_STATIC="microservice-b/docs/openapi.yaml"
          SPEC_BASELINE="microservice-b/docs/openapi-baseline.yaml"

          if [ -f "${SPEC_STATIC}" ]; then
            cp "${SPEC_STATIC}" /tmp/revision-spec.yaml
            echo "Usando spec estática: ${SPEC_STATIC}"
            echo "found=true" >> $GITHUB_OUTPUT
          elif [ -f "${SPEC_BASELINE}" ]; then
            cp "${SPEC_BASELINE}" /tmp/revision-spec.yaml
            echo "Usando spec baseline como revisión: ${SPEC_BASELINE}"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No se encontró spec para microservice-b."
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: "Quality Gates · Obtener spec baseline (rama base)"
        id: base-spec
        if: steps.current-spec.outputs.found == 'true'
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "${BASE_REF}" --depth=1

          if git show "origin/${BASE_REF}:microservice-b/docs/openapi.yaml" \
              > /tmp/base-spec.yaml 2>/dev/null; then
            echo "✅ Baseline obtenida: microservice-b/docs/openapi.yaml @ origin/${BASE_REF}"
            echo "found=true" >> $GITHUB_OUTPUT
          elif git show "origin/${BASE_REF}:microservice-b/docs/openapi-baseline.yaml" \
              > /tmp/base-spec.yaml 2>/dev/null; then
            echo "✅ Baseline obtenida: microservice-b/docs/openapi-baseline.yaml @ origin/${BASE_REF}"
            echo "found=true" >> $GITHUB_OUTPUT
          elif [ -f "microservice-b/docs/openapi-baseline.yaml" ]; then
            cp "microservice-b/docs/openapi-baseline.yaml" /tmp/base-spec.yaml
            echo "⚠️ Usando baseline local (origin/${BASE_REF} no tiene spec)"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No se encontró spec baseline para microservice-b"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: "Quality Gates · Instalar oasdiff"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        run: |
          OASDIFF_VERSION="v1.10.20"
          wget -qO /tmp/oasdiff.tar.gz \
            "https://github.com/tufin/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: "Quality Gates · Analizar diferencias (diff completo)"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        run: |
          echo "====== DIFERENCIAS OPENAPI — microservice-b ======"
          oasdiff diff /tmp/base-spec.yaml /tmp/revision-spec.yaml \
            --format text 2>&1 | tee /tmp/diff-msvc-b.txt || true
          echo "=================================================="

      - name: "Quality Gates · Detectar breaking changes — microservice-b"
        if: steps.current-spec.outputs.found == 'true' && steps.base-spec.outputs.found == 'true'
        id: breaking
        run: |
          echo "====== BREAKING CHANGES — microservice-b ======"
          set +e
          oasdiff breaking /tmp/base-spec.yaml /tmp/revision-spec.yaml \
            --format text 2>&1 | tee /tmp/breaking-msvc-b.txt
          EXIT_CODE=$?
          set -e
          echo "================================================"

          BREAKING_LINES=$(grep -c . /tmp/breaking-msvc-b.txt 2>/dev/null || echo 0)

          if [ $EXIT_CODE -ne 0 ] || [ "$BREAKING_LINES" -gt 0 ]; then
            echo "breaking_found=true" >> $GITHUB_OUTPUT
            echo "breaking_count=${BREAKING_LINES}" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Se detectaron ${BREAKING_LINES} breaking change(s) en microservice-b"
          else
            echo "breaking_found=false" >> $GITHUB_OUTPUT
            echo "breaking_count=0" >> $GITHUB_OUTPUT
            echo "✅ Sin breaking changes en microservice-b"
          fi

      - name: "Quality Gates · Subir reporte de breaking changes"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-breaking-changes-microservice-b-${{ github.run_id }}
          path: |
            /tmp/breaking-msvc-b.txt
            /tmp/diff-msvc-b.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: "Quality Gates · Bloquear pipeline por breaking changes"
        if: steps.breaking.outputs.breaking_found == 'true'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ❌  PIPELINE BLOQUEADO — Breaking Changes Detectados        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Servicio: microservice-b                                    ║"
          echo "║  Breaking changes: ${{ steps.breaking.outputs.breaking_count }}                                           ║"
          echo "║                                                              ║"
          echo "║  Acciones requeridas:                                        ║"
          echo "║  1. Revisar el reporte adjunto (Artifacts)                   ║"
          echo "║  2. Hacer los cambios compatibles hacia atrás (non-breaking) ║"
          echo "║  3. O versionar la API con /v2/ manteniendo /v1/             ║"
          echo "║  4. O obtener aprobación explícita del equipo consumidor     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          cat /tmp/breaking-msvc-b.txt
          exit 1

  # ── Job: Resumen final ───────────────────────────────────────────────────────
  summary:
    name: "3 · Quality Gates · Resumen Contract Check"
    runs-on: ubuntu-latest
    needs: [detect-changes, check-microservice-a, check-microservice-b]
    if: always()

    steps:
      - name: "Quality Gates · Evaluar resultado global"
        run: |
          A_RESULT="${{ needs.check-microservice-a.result }}"
          B_RESULT="${{ needs.check-microservice-b.result }}"

          echo "====== RESUMEN CONTRACT CHECK ======"
          echo ""

          if [ "$A_RESULT" = "success" ] || [ "$A_RESULT" = "skipped" ]; then
            echo "✅ microservice-a: SIN breaking changes (${A_RESULT})"
          else
            echo "❌ microservice-a: BREAKING CHANGES DETECTADOS (${A_RESULT})"
          fi

          if [ "$B_RESULT" = "success" ] || [ "$B_RESULT" = "skipped" ]; then
            echo "✅ microservice-b: SIN breaking changes (${B_RESULT})"
          else
            echo "❌ microservice-b: BREAKING CHANGES DETECTADOS (${B_RESULT})"
          fi

          echo ""
          echo "===================================="

          if [ "$A_RESULT" = "failure" ] || [ "$B_RESULT" = "failure" ]; then
            echo "❌ Contract check FALLIDO — revisar breaking changes"
            exit 1
          else
            echo "✅ Contract check EXITOSO — no se detectaron breaking changes incompatibles"
          fi
