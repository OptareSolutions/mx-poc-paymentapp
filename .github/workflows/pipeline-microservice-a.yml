# [microservice-a] CI - Caller para reusable-microservice-pipeline.yml
# Equipo: PaymentBox Core (Team A)
# Deliver: `feature/**` ⇒ smoke + GitOps (liviano); troncales E/A/F/PRODUCCION ⇒ karate/E2E + GitOps.
# Ambientes: E->dev | A->qa | F->preprod | PRODUCCION->prod
name: "[microservice-a] CICD"
# run-name: prefijo fijo + tipo de disparo (PR | MANUAL | PUSH FEATURE | PUSH TRUNK) — escaneable en lista de Actions.
run-name: ${{ (github.event_name == 'pull_request' && format('[microservice-a] PR · #{0} · {1} → {2} · {3}', github.event.pull_request.number, github.head_ref, github.base_ref, github.event.pull_request.title)) || (github.event_name == 'workflow_dispatch' && format('[microservice-a] MANUAL · {0}', github.ref_name)) || (startsWith(github.ref_name, 'feature/') && format('[microservice-a] PUSH · FEATURE · {0}', github.ref_name)) || format('[microservice-a] PUSH · TRUNK · {0}', github.ref_name) }}

on:
  push:
    # Post-merge/pre integración sobre ramas con overlay explícito; feature/** ⇒ env por defecto `env-e` en reusable.
    branches: [feature/**, E, A, F, PRODUCCION]
    paths:
      - 'microservice-a/**'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  pull_request:
    # Ramos base (rama destino) del PR. Usual: HEAD = feature/** → BUILD validando merge hacia esa base,
    # sin Deliver hasta el push después del merge — ver reusable (event_name).
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-a/**'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  workflow_dispatch:

concurrency:
  group: microservice-a-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: CICD
    uses: ./.github/workflows/reusable-microservice-pipeline.yml
    with:
      microservice_name: microservice-a
      image_name: optaresolutions/mx-poc-paymentapp/microservice-a
      # E2E (Karate) sólo en troncales; features iteran con smoke+GitOps hacia env-e.
      test_runner: ${{ startsWith(github.ref_name, 'feature/') && 'smoke' || 'karate' }}
    secrets: inherit
