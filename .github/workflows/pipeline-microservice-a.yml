# [microservice-a] CI - Caller para reusable-microservice-pipeline.yml
# Equipo: PaymentBox Core (Team A) | test_runner: karate (E2E + k6 + Selenium)
# Ambientes: E->dev | A->qa | F->preprod | PRODUCCION->prod
name: "[microservice-a] CI · Build · Test · Quality Gates · Publish · Deliver"

on:
  push:
    # Post-merge: pipeline completo (Build+Test+QG+Publish+Deploy)
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-a/**'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  pull_request:
    # Pre-merge: Build+Test+QG+Publish (sin Deploy — el if en reusable lo omite)
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-a/**'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  workflow_dispatch:

concurrency:
  group: microservice-a-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: "Build → Test → Quality Gates → Publish → Deliver"
    uses: ./.github/workflows/reusable-microservice-pipeline.yml
    with:
      microservice_name: microservice-a
      image_name: optaresolutions/mx-poc-paymentapp/microservice-a
      test_runner: karate
    secrets: inherit
