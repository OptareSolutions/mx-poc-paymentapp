name: "[microservice-a] CI � Build � Calidad � Seguridad � Deploy"

# ------------------------------------------------------------------------------
# Equipo: PaymentBox Core (Team A)
# Trigger: push en cualquier rama cuando cambia microservice-a/**
# Objetivo: Build � Calidad (JaCoCo+SonarCloud) � Seguridad (Trivy) � E2E � GitOps
#
# Ambientes por rama:
#   develop ? env-e (Desarrollo)  [DEMO BREAK 2 falla en este pipeline, rama qa]
#   qa      ? env-a (QA)
#   uat     ? env-u (UAT)
#   main    ? prod  (Produ��o)
# ------------------------------------------------------------------------------

on:
  push:
    branches: [develop, qa, uat, main]
    paths:
      - 'microservice-a/**'
      - '.github/workflows/pipeline-microservice-a.yml'
  workflow_dispatch:

concurrency:
  group: microservice-a-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: optaresolutions/mx-poc-paymentapp/microservice-a

# ------------------------------------------------------------------------------
# JOB 1 � Build & Quality (Shift-Left)
# ------------------------------------------------------------------------------
jobs:
  build-quality:
    name: "1 � Build & Quality � Shift-Left [microservice-a]"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud necesita historial completo

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unit Tests + JaCoCo
        working-directory: microservice-a
        run: gradle test jacocoTestReport --no-daemon

      - name: Gate de Cobertura (= 80%)
        working-directory: microservice-a
        run: gradle jacocoTestCoverageVerification --no-daemon

      - name: Subir informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservice-a-test-results-${{ github.ref_name }}
          path: microservice-a/build/reports/

      - name: "SonarCloud � An�lisis de Calidad de C�digo"
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: microservice-a

      - name: Build JAR (artefacto)
        working-directory: microservice-a
        run: gradle bootJar --no-daemon -x test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: microservice-a-jar-${{ github.run_id }}
          path: microservice-a/build/libs/*.jar

# ------------------------------------------------------------------------------
# JOB 2 � Security Scan (Trivy Filesystem)
# ------------------------------------------------------------------------------
  security-scan:
    name: "2 � Seguridad � Trivy Scan [microservice-a]"
    runs-on: ubuntu-latest
    needs: build-quality
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-a-jar-${{ github.run_id }}
          path: microservice-a/build/libs/

      - name: "Trivy � Scan Filesystem (JAR + dependencias)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: microservice-a
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload SARIF (Filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-microservice-a

# ------------------------------------------------------------------------------
# JOB 3 � Image Ops (Build ? Scan ? Push GHCR)
# ------------------------------------------------------------------------------
  image-ops:
    name: "3 � Image Ops � Build � Scan � Push [microservice-a]"
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      env-overlay: ${{ steps.env-info.outputs.overlay }}
      env-name: ${{ steps.env-info.outputs.name }}
      full-image: ${{ steps.image-tag.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-a-jar-${{ github.run_id }}
          path: microservice-a/build/libs/

      - name: Mapear rama ? ambiente
        id: env-info
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (Desarrollo)" >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
            qa)      echo "overlay=env-a" >> $GITHUB_OUTPUT ; echo "name=A (QA)"              >> $GITHUB_OUTPUT ; echo "prefix=env-a" >> $GITHUB_OUTPUT ;;
            uat)     echo "overlay=env-u" >> $GITHUB_OUTPUT ; echo "name=U (UAT)"             >> $GITHUB_OUTPUT ; echo "prefix=env-u" >> $GITHUB_OUTPUT ;;
            main)    echo "overlay=prod"  >> $GITHUB_OUTPUT ; echo "name=Producci�n"            >> $GITHUB_OUTPUT ; echo "prefix=prod"  >> $GITHUB_OUTPUT ;;
            *)       echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (manual)"          >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
          esac

      - name: Calcular tag de imagen (${{ steps.env-info.outputs.prefix }}-{sha})
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ steps.env-info.outputs.prefix }}-${SHORT_SHA}"
          FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"          >> $GITHUB_OUTPUT
          echo "full_image=${FULL}"  >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (local � para scan)
        uses: docker/build-push-action@v5
        with:
          context: microservice-a
          file: microservice-a/src/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy — Scan Imagen Docker (CRITICAL informativo)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload SARIF (Image Scan)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-microservice-a

      - name: Push ? GHCR con tag ${{ steps.image-tag.outputs.tag }}
        uses: docker/build-push-action@v5
        with:
          context: microservice-a
          file: microservice-a/src/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ------------------------------------------------------------------------------
# JOB 4 � E2E Tests + GitOps Deploy
# ??  DEMO BREAK 2: falla en este job cuando rama=qa con monto m�nimo $100
# ------------------------------------------------------------------------------
  e2e-gitops:
    name: "4 � E2E Tests + GitOps Deploy [${{ needs.image-ops.outputs.env-name }}]"
    runs-on: ubuntu-latest
    needs: image-ops
    permissions:
      contents: write

    env:
      IMAGE_TAG:  ${{ needs.image-ops.outputs.image-tag }}
      OVERLAY:    ${{ needs.image-ops.outputs.env-overlay }}
      ENV_NAME:   ${{ needs.image-ops.outputs.env-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar JDK 17 (Karate + Maven)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Maven (~/.m2/repository)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('tests/functional-karate/pom.xml', 'tests/ui-selenium/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar Entorno Simulado (docker-compose)
        run: |
          cd simulation
          docker compose up -d --build
          echo "? Esperando arranque de los servicios (90s)..."
          sleep 90
          docker compose ps
          echo "--- Logs microservice-b ---"
          docker compose logs --tail=30 microservice-b || true
          echo "--- Logs microservice-a ---"
          docker compose logs --tail=50 microservice-a || true

      - name: Health Check microservice-b
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18081/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "? microservice-b UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "? microservice-b no arranc�"
            cd simulation && docker compose logs microservice-b
            exit 1
          fi

      - name: Health Check microservice-a
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "? microservice-a UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "? microservice-a no arranc�"
            cd simulation && docker compose logs microservice-a
            exit 1
          fi

      - name: "??  DEMO BREAK 2 ? Karate E2E � Flujo Completo 8 Pasos"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci -Dtest=RecargaFlowRunner#testRecargaFlow \
            --no-transfer-progress

      - name: Subir Informe Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-e2e-report-${{ env.OVERLAY }}-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/

      - name: "Selenium � Validaci�n UI"
        run: |
          cd tests/ui-selenium
          mvn test -Dapp.url=http://localhost:8080 --no-transfer-progress
        continue-on-error: true

      - name: "k6 Smoke Test � Performance"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: Parar Ambiente
        if: always()
        run: cd simulation && docker compose down -v

      - name: "GitOps � Actualizar manifiesto: microservice-a ? ${{ env.IMAGE_TAG }} en ${{ env.OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys
          overlay  = os.environ['OVERLAY']
          new_tag  = os.environ['IMAGE_TAG']
          filepath = f'k8s/overlays/{overlay}/kustomization.yaml'
          service  = 'microservice-a'
          registry = 'ghcr.io/optaresolutions/mx-poc-paymentapp'

          with open(filepath) as f:
              content = f.read()

          pattern     = rf'(- name: {re.escape(registry)}/{service}\n\s+newTag:)[^\n]*'
          replacement = rf'\1 "{new_tag}"'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              print(f'??  Patr�n no encontrado en {filepath}', file=sys.stderr)
              sys.exit(1)

          with open(filepath, 'w') as f:
              f.write(new_content)
          print(f'? {service}: {new_tag} ? k8s/overlays/{overlay}/kustomization.yaml')
          EOF

      - name: "Git commit + push � manifiesto actualizado [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops(microservice-a): ${IMAGE_TAG} ? ${ENV_NAME} [skip ci]"
          git push

      - name: "ArgoCD (simulado) � Sync ${{ env.ENV_NAME }}"
        run: |
          echo "---------------------------------------------------------------"
          echo "?? [ArgoCD] Cambio detectado en k8s/overlays/${OVERLAY}/"
          echo "?? [ArgoCD] Application: att-paymentbox-${OVERLAY}"
          echo "?? [ArgoCD] Servicio:    microservice-a"
          echo "?? [ArgoCD] Nueva imagen: ghcr.io/.../microservice-a:${IMAGE_TAG}"
          echo "?? [ArgoCD] Entorno:     ${ENV_NAME}"
          echo "?? [ArgoCD] Sync strategy: Apply (Prune=true, SelfHeal=true)"
          sleep 2
          echo "? [ArgoCD] Sync completado � microservice-a desplegado en ${ENV_NAME}"
          echo "?? [ArgoCD] Endpoint: http://microservice-a.${OVERLAY}.att-paymentbox.internal"
          echo "---------------------------------------------------------------"
