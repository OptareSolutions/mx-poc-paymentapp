name: "AT&T PaymentBox - Pipeline Declarativo PoC"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/microservice-a

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Build & Quality (Shift-Left: unitários + segurança primeiro)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build-and-quality:
    name: "1 · Build & Quality (Shift-Left)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservice-a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew || true

      - name: Build & Unit Tests (JUnit + JaCoCo)
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Verify Coverage Gate (≥ 80%)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: microservice-a/build/reports/

      - name: "Segurança: Veracode Pipeline Scan (simulado)"
        run: |
          echo "✅ [Shift-Left] Veracode SAST scan simulado para PoC."
          echo "Em produção: integrar com veracode/veracode-github-action."

      - name: "Segurança: SonarQube Analysis (simulado)"
        run: |
          echo "✅ [Shift-Left] SonarQube scan simulado para PoC."
          echo "Em produção: usar SonarSource/sonarcloud-github-action."

      - name: Build JAR (sem testes - já correram)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: microservice-a/build/libs/*.jar

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Integration & Contract (Simulation Environment A)
# ══════════════════════════════════════════════════════════════════════════════
  integration-and-contract:
    name: "2 · Integration & Contract (Ambiente A)"
    runs-on: ubuntu-latest
    needs: build-and-quality

    services:
      db-simulado:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: att_paymentbox
          POSTGRES_USER: att_user
          POSTGRES_PASSWORD: att_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U att_user -d att_paymentbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Apply TDM Schema & Seed Billy Profiles
        env:
          PGPASSWORD: att_pass
        run: |
          echo "🌱 A aplicar schema e seeders TDM (perfis Billy)..."
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/01_schema.sql
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/02_billy_profiles.sql
          echo "✅ Perfis Billy 1-5 criados com sucesso."

      - name: Verify Billy 1 in DB (contrato TDM)
        env:
          PGPASSWORD: att_pass
        run: |
          COUNT=$(psql -h localhost -U att_user -d att_paymentbox -t -c \
            "SELECT COUNT(*) FROM clientes WHERE telefono='4544' AND status='ACTIVO';")
          echo "Billy 1 count: $COUNT"
          [ "$COUNT" -eq "1" ] || (echo "❌ FAIL: Billy 1 não encontrado na DB" && exit 1)

      - name: Verify Montos in DB (Paso 3)
        env:
          PGPASSWORD: att_pass
        run: |
          COUNT=$(psql -h localhost -U att_user -d att_paymentbox -t -c \
            "SELECT COUNT(*) FROM montos_recarga WHERE operador='BLUE';")
          echo "Montos BLUE count: $COUNT"
          [ "$COUNT" -ge "5" ] || (echo "❌ FAIL: Montos insuficientes para BLUE" && exit 1)

      - name: Start Prism Mocks (Operador + Recibo)
        run: |
          npm install -g @stoplight/prism-cli
          echo "🚀 A iniciar mock Operador (Paso 4) na porta 4010..."
          prism mock simulation/prism-mocks/operador.yaml --port 4010 &
          echo "🚀 A iniciar mock Recibo (Paso 8) na porta 4011..."
          prism mock simulation/prism-mocks/recibo.yaml --port 4011 &
          sleep 5
          echo "✅ Mocks Prism iniciados."

      - name: Contract Validation - Operador Mock (Paso 4)
        run: |
          echo "🔍 Validando contrato da API Operador via Prism..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:4010/api/operador/validar \
            -H "Content-Type: application/json" \
            -d '{"telefono":"4544","operador":"BLUE"}')
          echo "HTTP Status: $STATUS"
          [ "$STATUS" -eq "200" ] || \
            (echo "❌ FALHA DE CONTRATO: API Operador não responde com 200" && exit 1)
          echo "✅ Contrato API Operador validado."

      - name: Contract Validation - Recibo Mock (Paso 8)
        run: |
          echo "🔍 Validando contrato da API Recibo via Prism..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:4011/api/recibo/emitir \
            -H "Content-Type: application/json" \
            -d '{"folio":"B-89301","numeroOrden":"111816681"}')
          echo "HTTP Status: $STATUS"
          [ "$STATUS" -eq "200" ] || \
            (echo "❌ FALHA DE CONTRATO: API Recibo não responde com 200" && exit 1)
          echo "✅ Contrato API Recibo validado."

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — Image Ops (Build & Push Docker Image)
# ══════════════════════════════════════════════════════════════════════════════
  image-ops:
    name: "3 · Image Ops (Docker Build)"
    runs-on: ubuntu-latest
    needs: integration-and-contract
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: microservice-a/build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=poc-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: microservice-a
          file: microservice-a/src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — Functional E2E & Deploy (Karate + Selenium + k6)
# ══════════════════════════════════════════════════════════════════════════════
  functional-e2e:
    name: "4 · Functional E2E & Deploy (Karate + Selenium + k6)"
    runs-on: ubuntu-latest
    needs: image-ops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Start Ambiente A (docker-compose)
        run: |
          cd simulation
          docker compose up -d --wait
          echo "⏳ Aguardando serviços ficarem saudáveis..."
          sleep 20
          docker compose ps

      - name: Verify Microservice A health
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "✅ Microservice A UP" && break
            sleep 5
          done
          [ "$STATUS" -eq "200" ] || (echo "❌ Microservice A não arrancou" && exit 1)

      - name: "Karate DSL - Testes Funcionais (Passos 2, 3, 4, 5, 7, 8)"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci --no-transfer-progress
        continue-on-error: false

      - name: Upload Karate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: tests/functional-karate/target/surefire-reports/

      - name: "Selenium Headless - Validação UI (Passos 1, 3, 5)"
        run: |
          cd tests/ui-selenium
          mvn test -Dapp.url=http://localhost:8080 --no-transfer-progress

      - name: Upload Selenium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: tests/ui-selenium/target/surefire-reports/

      - name: "k6 Smoke Test - Rota Crítica Performance (Paso 6)"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          mkdir -p tests/k6/results
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: tests/k6/results/

      - name: Stop Ambiente A
        if: always()
        run: cd simulation && docker compose down -v
