name: "LEGACY · Build · Test · Quality Gates · Publish · Deliver"

# ==============================================================================
# ADVERTENCIA: ARCHIVO LEGACY - DEPRECADO - NO USAR EN PRODUCCION
#
# Este pipeline monolitico ha sido sustituido por los pipelines por microservicio.
# Se conserva UNICAMENTE como referencia historica / documentacion.
#
# FECHA DE DEPRECACION: 2026-05-04
# MOTIVO: Sustituido por pipelines dedicados por microservicio y de integracion.
#
# Pipelines activos (usar estos en su lugar):
#   .github/workflows/pipeline-microservice-a.yml  (path trigger: microservice-a/**)
#   .github/workflows/pipeline-microservice-b.yml  (path trigger: microservice-b/**)
#   .github/workflows/pipeline-integration.yml     (workflow_dispatch - promocion manual)
#
# Este archivo NO tiene triggers automaticos (solo workflow_dispatch manual)
# y esta alojado en .github/workflows/legacy/ para evitar confusion.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "LEGACY - Motivo de ejecucion manual (solo referencia/debug)"
        required: false
        default: "ejecucion manual de referencia LEGACY"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_A: ${{ github.repository }}/microservice-a
  IMAGE_NAME_B: ${{ github.repository }}/microservice-b
  IMAGE_NAME_UI: ${{ github.repository }}/ui-paymentbox

# ------------------------------------------------------------------------------
# JOB 1 � Build & Quality (Shift-Left: unitarios + seguridad primero)
# ------------------------------------------------------------------------------
jobs:
  build-and-quality:
    name: "1 · Build + Test + Quality Gates (LEGACY)"
    runs-on: ubuntu-latest

    steps:
      - name: "Build · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Build · Configurar JDK 17"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Build · Configurar Gradle (sin wrapper local)"
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: "8.7"

      - name: "Test · microservice-a Unitarios (JUnit + JaCoCo)"
        working-directory: microservice-a
        run: gradle test jacocoTestReport --no-daemon

      - name: "Quality Gates · microservice-a Cobertura (= 80%)"
        working-directory: microservice-a
        run: gradle jacocoTestCoverageVerification --no-daemon

      - name: "Test · Subir resultados microservice-a"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: microservice-a/build/reports/

      - name: "Test · microservice-b Unitarios (JUnit + JaCoCo)"
        working-directory: microservice-b
        run: gradle test jacocoTestReport --no-daemon

      - name: "Quality Gates · microservice-b Cobertura (= 80%)"
        working-directory: microservice-b
        run: gradle jacocoTestCoverageVerification --no-daemon

      - name: "Test · Subir resultados microservice-b"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results-b
          path: microservice-b/build/reports/

      - name: "Quality Gates · Seguridad Veracode Pipeline Scan (simulado)"
        run: |
          echo "? [Shift-Left] Veracode SAST scan simulado para PoC."
          echo "En producci�n: integrar con veracode/veracode-github-action."

      - name: "Quality Gates · Seguridad SonarQube Analysis (simulado)"
        run: |
          echo "? [Shift-Left] SonarQube scan simulado para PoC."
          echo "En producci�n: usar SonarSource/sonarcloud-github-action."

      - name: "Build · JAR microservice-a (sin tests - ya ejecutados)"
        working-directory: microservice-a
        run: gradle bootJar --no-daemon -x test

      - name: "Build · Subir artefacto JAR microservice-a"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-jar
          path: microservice-a/build/libs/*.jar

      - name: "Build · JAR microservice-b"
        working-directory: microservice-b
        run: gradle bootJar --no-daemon -x test

      - name: "Build · Subir artefacto JAR microservice-b"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-jar-b
          path: microservice-b/build/libs/*.jar

# ------------------------------------------------------------------------------
# JOB 2 � Integration & Contract (Ambiente A Simulado)
# ------------------------------------------------------------------------------
  integration-and-contract:
    name: "2 · Test + Quality Gates · Integration & Contract (LEGACY)"
    runs-on: ubuntu-latest
    needs: build-and-quality

    services:
      db-simulado:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: att_paymentbox
          POSTGRES_USER: att_user
          POSTGRES_PASSWORD: att_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U att_user -d att_paymentbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Test · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Test · Configurar JDK 17"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Test · Instalar psql client"
        run: sudo apt-get install -y postgresql-client

      - name: "Test · Aplicar Schema TDM y Perfiles Billy"
        env:
          PGPASSWORD: att_pass
        run: |
          echo "?? Aplicando schema y seeders TDM (perfiles Billy)..."
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/01_schema.sql
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/02_billy_profiles.sql
          echo "? Perfiles Billy 1-5 creados correctamente."

      - name: "Quality Gates · Verificar Billy 1 en DB (contrato TDM)"
        env:
          PGPASSWORD: att_pass
        run: |
          COUNT=$(psql -h localhost -U att_user -d att_paymentbox -t -c \
            "SELECT COUNT(*) FROM clientes WHERE telefono='4544' AND status='ACTIVO';")
          echo "Billy 1 count: $COUNT"
          [ "$COUNT" -eq "1" ] || (echo "? FALLO: Billy 1 no encontrado en DB" && exit 1)

      - name: "Quality Gates · Verificar Montos en DB (Paso 3)"
        env:
          PGPASSWORD: att_pass
        run: |
          COUNT=$(psql -h localhost -U att_user -d att_paymentbox -t -c \
            "SELECT COUNT(*) FROM montos_recarga WHERE operador='BLUE';")
          echo "Montos BLUE count: $COUNT"
          [ "$COUNT" -ge "5" ] || (echo "? FALLO: Montos insuficientes para BLUE" && exit 1)

      - name: "Test · Iniciar Mocks Prism (Operador + Recibo)"
        run: |
          npm install -g @stoplight/prism-cli
          echo "?? Iniciando mock Operador (Paso 4) en puerto 4010..."
          prism mock simulation/prism-mocks/operador.yaml --port 4010 &
          echo "?? Iniciando mock Recibo (Paso 8) en puerto 4011..."
          prism mock simulation/prism-mocks/recibo.yaml --port 4011 &
          sleep 5
          echo "? Mocks Prism iniciados correctamente."

      - name: "Quality Gates · Validacion de Contrato - Mock Operador (Paso 4)"
        run: |
          echo "?? Validando contrato API Operador via Prism..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:4010/api/operador/validar \
            -H "Content-Type: application/json" \
            -d '{"telefono":"4544","operador":"BLUE"}')
          echo "HTTP Status: $STATUS"
          [ "$STATUS" -eq "200" ] || \
            (echo "? FALLO DE CONTRATO: API Operador no responde con 200" && exit 1)
          echo "? Contrato API Operador validado."

      - name: "Quality Gates · Validacion de Contrato - Mock Recibo (Paso 8)"
        run: |
          echo "?? Validando contrato API Recibo via Prism..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:4011/api/recibo/emitir \
            -H "Content-Type: application/json" \
            -d '{"folio":"B-89301","numeroOrden":"111816681"}')
          echo "HTTP Status: $STATUS"
          [ "$STATUS" -eq "200" ] || \
            (echo "? FALLO DE CONTRATO: API Recibo no responde con 200" && exit 1)
          echo "? Contrato API Recibo validado."

      - name: "Test · Download JAR microservice-b"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar-b
          path: microservice-b/build/libs/

      - name: "Test · Iniciar microservice-b para contrato inter-servicios"
        run: |
          java -jar microservice-b/build/libs/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/att_paymentbox \
            --spring.datasource.username=att_user \
            --spring.datasource.password=att_pass \
            --server.port=8081 &
          echo "? Esperando arranque de microservice-b..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "? microservice-b disponible" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "? microservice-b no arranc�" && exit 1
          fi

      - name: "Quality Gates · DEMO BREAK 1 · Karate Contrato microservice-a -> microservice-b"
        run: |
          cd tests/functional-karate
          echo "?? Validando contrato p�blico de microservice-b (campos 'telefono', 'nombre', 'status')..."
          mvn test -Dkarate.env=ci -Dtest=RecargaFlowRunner#testContratoMicroservicios \
            --no-transfer-progress
          echo "? Contrato inter-servicios validado."

# ------------------------------------------------------------------------------
# JOB 3 � Image Ops (Build & Push Docker Images)
# ------------------------------------------------------------------------------
  image-ops:
    name: "4 · Publish · Image Ops (Docker Build)"
    runs-on: ubuntu-latest
    needs: integration-and-contract
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Publish · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Publish · Download JAR artifact microservice-a"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar
          path: microservice-a/build/libs/

      - name: "Publish · Download JAR artifact microservice-b"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar-b
          path: microservice-b/build/libs/

      - name: "Publish · Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: "Publish · Log in to GitHub Container Registry"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish · Extract Docker metadata (microservice-a)"
        id: meta-a
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_A }}
          tags: |
            type=sha,prefix=poc-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Publish · Build and Push microservice-a"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: microservice-a
          file: microservice-a/src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-a.outputs.tags }}
          labels: ${{ steps.meta-a.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Publish · Extract Docker metadata (microservice-b)"
        id: meta-b
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_B }}
          tags: |
            type=sha,prefix=poc-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Publish · Build and Push microservice-b"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: microservice-b
          file: microservice-b/src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-b.outputs.tags }}
          labels: ${{ steps.meta-b.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Publish · Set up Node.js (para build Angular UI)"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-paymentbox/package-lock.json

      - name: "Publish · Extract Docker metadata (ui-paymentbox)"
        id: meta-ui
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
          tags: |
            type=sha,prefix=poc-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Publish · Build and Push ui-paymentbox"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ui-paymentbox
          file: ui-paymentbox/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ------------------------------------------------------------------------------
# JOB 4 � Functional E2E & Deploy (Karate + Selenium + k6)
# ------------------------------------------------------------------------------
  functional-e2e:
    name: "5 · Deliver · Functional E2E & Deploy (Karate + Selenium + k6)"
    runs-on: ubuntu-latest
    needs: image-ops

    steps:
      - name: "Deliver · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Deliver · Set up JDK 17"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Deliver · Login a GHCR (imagen pre-construida Ambiente A)"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Deliver · Iniciar Ambiente A (docker-compose)"
        run: |
          cd simulation
          docker compose pull microservice-a microservice-b || true
          docker compose up -d --no-build
          echo "? Esperando arranque de servicios (90s)..."
          sleep 90
          docker compose ps
          echo "--- Logs microservice-b ---"
          docker compose logs --tail=30 microservice-b || true
          echo "--- Logs microservice-a ---"
          docker compose logs --tail=50 microservice-a || true
          echo "--- Logs db-simulado ---"
          docker compose logs --tail=20 db-simulado || true

      - name: "Deliver · Verificar salud de microservice-b"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "? microservice-b disponible" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "? microservice-b no arranc� - Mostrando logs:"
            cd simulation && docker compose logs --tail=80 microservice-b
            exit 1
          fi

      - name: "Deliver · Verificar salud del Microservicio A"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "? Microservicio A disponible" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "? Microservicio A no arranc� - Mostrando logs:"
            cd simulation && docker compose logs --tail=80 microservice-a
            exit 1
          fi

      - name: "Deliver · DEMO BREAK 2 · Karate DSL - Tests Funcionales"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci --no-transfer-progress
        continue-on-error: false

      - name: "Deliver · Subir Reporte Karate"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: karate-report
          path: tests/functional-karate/target/surefire-reports/

      - name: "Deliver · Selenium Headless - Validacion UI"
        run: |
          cd tests/ui-selenium
          mvn test -Dapp.url=http://localhost:8080 --no-transfer-progress

      - name: "Deliver · Subir Reporte Selenium"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selenium-report
          path: tests/ui-selenium/target/surefire-reports/

      - name: "Deliver · k6 Smoke Test - Ruta Critica Performance"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          mkdir -p tests/k6/results
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: "Deliver · Subir Resultados k6"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-smoke-results
          path: tests/k6/results/

      - name: "Deliver · Detener Ambiente A"
        if: always()
        run: cd simulation && docker compose down -v
