# ==============================================================================
# Reusable Microservice Pipeline
# Eliminates duplication between pipeline-microservice-a.yml and
# pipeline-microservice-b.yml by centralising the 5 shared jobs.
#
# Inputs:
#   microservice_name  – microservice-a | microservice-b
#   image_name         – GHCR image path (without registry prefix)
#   test_runner        – karate (E2E full suite) | smoke (contract smoke test)
#
# Branch → Overlay (suffix tag / manifest):
#   E          → env-e  · Desarrollo
#   A          → env-a  · QA
#   F          → env-f  · Preprod (alias en scripts)
#   PRODUCCION → prod   · Producción
#   *          → env-e  · ramas tipo `feature/*`, etc.: overlay desarrollo
#
# Momentos (caller `pipeline-microservice-*.yml`):
#   · push sobre feature/*, E, A, F, PRODUCCIÓN  → ejecuta reproducible hasta Publish (+ Deliver si `push|dispatch`)
#   · pull_request ↔ base branch ∈ {E, A, F, PRODUCCIÓN} típico head feature/*
#       ⇒ validación antes de fusionar; Deliver sigue sólo después del merge (`push`).
#
# Mapeo ante PR: usar **base_ref** como destino lógico (ambiente donde se fusionará),
# no la rama sintética de merge.
#
# Jobs Deliver + gates Operaciones/Dev siguen sólo cuando `push` ó `workflow_dispatch`
# (`github.event_name`) — sobre PR sólo compilás/calidades/publicás etiqueta provisional.
#
# ==============================================================================
name: "Reusable: Microservice CI/CD pipeline"

on:
  workflow_call:
    inputs:
      microservice_name:
        description: "Name of the microservice (microservice-a or microservice-b)"
        required: true
        type: string
      image_name:
        description: "Container image name (e.g. optaresolutions/mx-poc-paymentapp/microservice-a)"
        required: true
        type: string
      test_runner:
        description: "Test runner to use: karate (E2E) or smoke (contract)"
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image_name }}

# ------------------------------------------------------------------------------
# Pipeline stages shown in GitHub Actions:
#   1. Build          -> compiles and publishes the JAR artifact
#   2. Test           -> unit tests, JaCoCo report, coverage gate, test artifacts
#   3. Quality Gates  -> Gitleaks, SonarCloud, Trivy filesystem scan
#   4. Publish        -> Docker build, image scan, push to GHCR
#   4b. Operaciones    -> gate de aprobación (solo push a A o F), environment OPERACIONES
#   5. Deliver        -> E2E/smoke validation, GitOps manifest update, ArgoCD sync
# ------------------------------------------------------------------------------
jobs:
  build:
    name: "1 · Build · Gradle JAR [${{ inputs.microservice_name }}]"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.project-version.outputs.version }}

    steps:
      - name: "Build · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Build · Configurar JDK 17"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin

      - name: "Build · Configurar Gradle 8.7"
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          gradle-version: "8.7"

      - name: "Build · Get version from Gradle"
        id: project-version
        working-directory: ${{ inputs.microservice_name }}
        run: |
          VERSION=$(gradle properties -q --no-daemon | awk -F': ' '$1 == "version" {print $2; exit}')
          if [ -z "$VERSION" ]; then
            echo "No se pudo obtener la version del proyecto"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: "Build · Generar JAR sin tests"
        working-directory: ${{ inputs.microservice_name }}
        run: gradle bootJar --no-daemon -x test

      - name: "Build · Upload JAR"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.microservice_name }}-jar-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/libs/*.jar
          retention-days: 1

# ------------------------------------------------------------------------------
# JOB 2 – Test (unitarios + cobertura)
# ------------------------------------------------------------------------------
  test:
    name: "2 · Test · Unitarios + JaCoCo [${{ inputs.microservice_name }}]"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: "Test · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Test · Configurar JDK 17"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin

      - name: "Test · Configurar Gradle 8.7"
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          gradle-version: "8.7"

      - name: "Test · Unit Tests + JaCoCo"
        working-directory: ${{ inputs.microservice_name }}
        run: gradle test jacocoTestReport --no-daemon

      - name: "Test · Gate de Cobertura (>= 80%)"
        working-directory: ${{ inputs.microservice_name }}
        run: gradle jacocoTestCoverageVerification --no-daemon

      - name: "Test · Subir informe de tests"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.microservice_name }}-test-results-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/reports/
          retention-days: 14

# ------------------------------------------------------------------------------
# JOB 3 – Quality Gates (Gitleaks + SonarCloud + Trivy Filesystem)
# ------------------------------------------------------------------------------
  quality-gates:
    name: "3 · Quality Gates · Secrets + Sonar + Trivy FS [${{ inputs.microservice_name }}]"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Quality Gates · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # SonarCloud necesita historial completo

      - name: "Quality Gates · Download JAR"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.microservice_name }}-jar-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/libs/

      - name: "Quality Gates · Download test reports"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.microservice_name }}-test-results-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/reports/

      - name: "Quality Gates · Gitleaks secrets scan"
        # gitleaks/gitleaks-action@v2 requiere licencia de pago para orgs.
        # Usamos la CLI directamente: gratis, sin licencia, mismo resultado.
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

      - name: "Quality Gates · Configurar JDK 17 para SonarCloud"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin

      - name: "Quality Gates · Configurar Gradle 8.7 para SonarCloud"
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          gradle-version: "8.7"

      - name: "Quality Gates · Preparar bytecode para SonarCloud"
        working-directory: ${{ inputs.microservice_name }}
        run: |
          gradle classes testClasses --no-daemon
          mkdir -p build/classes/java/main build/classes/java/test

      - name: "Quality Gates · SonarCloud analisis de codigo"
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.microservice_name }}

      - name: "Quality Gates · Trivy filesystem scan (JAR + dependencias)"
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.30.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.microservice_name }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
          version: v0.70.0
          trivyignores: .trivyignore

      - name: "Quality Gates · Upload SARIF filesystem"
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-${{ inputs.microservice_name }}

# ------------------------------------------------------------------------------
# JOB 4 – Publish (Docker build + image scan + push GHCR)
# ------------------------------------------------------------------------------
  publish:
    name: "4 · Publish · Docker build + scan + GHCR [${{ inputs.microservice_name }}]"
    runs-on: ubuntu-latest
    needs: [build, quality-gates]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      env-overlay: ${{ steps.env-info.outputs.overlay }}
      env-name: ${{ steps.env-info.outputs.name }}
      full-image: ${{ steps.image-tag.outputs.full_image }}

    steps:
      - name: "Publish · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Publish · Download JAR"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.microservice_name }}-jar-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/libs/

      - name: "Publish · Mapear rama a ambiente"
        id: env-info
        run: |
          EVENT="${{ github.event_name }}"
          if [ "${EVENT}" = "pull_request" ]; then
            BRANCH_MAP="${{ github.base_ref }}"
          else
            BRANCH_MAP="${{ github.ref_name }}"
          fi
          echo "Mapped branch for overlays: ${BRANCH_MAP}" >> $GITHUB_STEP_SUMMARY

          case "${BRANCH_MAP}" in
            E)          echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (Desarrollo)" >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
            A)          echo "overlay=env-a" >> $GITHUB_OUTPUT ; echo "name=A (QA)"         >> $GITHUB_OUTPUT ; echo "prefix=env-a" >> $GITHUB_OUTPUT ;;
            F)          echo "overlay=env-f" >> $GITHUB_OUTPUT ; echo "name=F (Preprod)"    >> $GITHUB_OUTPUT ; echo "prefix=env-f" >> $GITHUB_OUTPUT ;;
            PRODUCCION) echo "overlay=prod"  >> $GITHUB_OUTPUT ; echo "name=Produccion"     >> $GITHUB_OUTPUT ; echo "prefix=prod"  >> $GITHUB_OUTPUT ;;
            *)          echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (manual)"     >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
          esac

      - name: "Publish · Calcular tag de imagen ({version}-{sha}.{run_number})"
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ needs.build.outputs.app-version }}"
          TAG="${VERSION}-${SHORT_SHA}.${{ github.run_number }}"
          FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "full_image=${FULL}" >> $GITHUB_OUTPUT

      - name: "Publish · Set up Docker Buildx"
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: "Publish · Login GHCR"
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish · Build Docker image local para scan"
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ${{ inputs.microservice_name }}
          file: ${{ inputs.microservice_name }}/src/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Publish · Trivy image scan (CRITICAL bloqueante)"
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.30.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          version: v0.70.0
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          scanners: vuln

      - name: "Publish · Upload SARIF image scan"
        if: always()
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-${{ inputs.microservice_name }}

      - name: "Publish · Push a GHCR con tag ${{ steps.image-tag.outputs.tag }}"
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ${{ inputs.microservice_name }}
          file: ${{ inputs.microservice_name }}/src/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ------------------------------------------------------------------------------
# JOB 4b – Puerta Operaciones sólo alta (GitHub Environment)
#
# Ramos **dev** (**E**, **feature/**…) → pasan directos (sin espera Deployments).
# Ramos **A** / **F** / **PRODUCCION** → `environment: OPERACIONES` con al menos una
# aprobación desde la pestaña Deployments. El copy nombre/steps marca explícito
# **Equipo de Operaciones**; en PoC pueden listar cualquier revisor válido como
# aprobador efectivo configurando ese environment del repo (quien apruebe hace las
# veces «Operaciones» a efectos de auditoría).
#
# Eventos: push + workflow_dispatch (coherente con Deliver).
# Repo: crear **OPERACIONES** en Settings → Environments cuando no exista.
# ------------------------------------------------------------------------------
  operations-approval-operaciones:
    name: "4b · Equipo de Operaciones · Aprobación requerida (A/F/PRODUCCION) [${{ inputs.microservice_name }}]"
    needs: publish
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref_name == 'A' ||
        github.ref_name == 'F' ||
        github.ref_name == 'PRODUCCION'
      )
    runs-on: ubuntu-latest
    environment: OPERACIONES
    permissions:
      contents: read
    steps:
      - name: "Equipo de Operaciones — pendiente revisión / Approve antes de Deliver"
        run: |
          echo "### Equipo de Operaciones · despliegue pendiente de aprobación" >> $GITHUB_STEP_SUMMARY
          echo "**Rama actual:** ${{ github.ref_name }}. En la UI de Deployments aparece esta petición etiquetada con el gate **OPERACIONES** (Equipo Operaciones)." >> $GITHUB_STEP_SUMMARY
          echo "**PoC:** configure el environment `OPERACIONES` con quien debe poder aceptar formalmente (**cualquier** colaborador con permiso cuenta si lo agregás como reviewer)." >> $GITHUB_STEP_SUMMARY

  operations-pass-through-no-ops-dev:
    name: "4b · Passthrough dev (sin aprobación, rama ${{ github.ref_name }}) [${{ inputs.microservice_name }}]"
    needs: publish
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref_name != 'A' &&
      github.ref_name != 'F' &&
      github.ref_name != 'PRODUCCION'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Sin gate GitHub Deployments para desarrollo (E / features)"
        run: |
          echo "Rama ${{ github.ref_name }}: desarrollo/feature — **Deliver continúa sin aprobación** (no existe gate OPERACIONES en este punto)." >> $GITHUB_STEP_SUMMARY

  deploy-ready:
    name: "4c · Gate · Listo para Deliver [${{ inputs.microservice_name }}]"
    needs: [publish, operations-approval-operaciones, operations-pass-through-no-ops-dev]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        needs.operations-approval-operaciones.result == 'success' ||
        needs.operations-pass-through-no-ops-dev.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Deliver desbloqueado (operaciones sí / dev bypass)"
        run: echo "Listo para etapa Deliver."

# ------------------------------------------------------------------------------
# JOB 5a – Deliver (E2E Tests + GitOps Deploy · microservice-a)
# Runs when test_runner == 'karate'
#
# IMPORTANTE: always() + comprobar publish/deploy-ready; así Deliver no hereda skips
# de la dependencia paralela (**gate Operaciones alta** vs passthrough desarrollo).
# ------------------------------------------------------------------------------
  e2e-gitops:
    name: "5 · Deliver · E2E + GitOps [${{ needs.publish.outputs.env-name }}]"
    needs: [publish, deploy-ready]
    if: >-
      ${{ always() && inputs.test_runner == 'karate' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.publish.result == 'success' &&
      needs.deploy-ready.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image-tag }}
      OVERLAY:   ${{ needs.publish.outputs.env-overlay }}
      ENV_NAME:  ${{ needs.publish.outputs.env-name }}

    steps:
      - name: "Deliver · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Deliver · Configurar JDK 17 (Karate + Maven)"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin

      - name: "Deliver · Login GHCR"
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Deliver · Iniciar entorno simulado (docker-compose)"
        run: |
          cd simulation
          docker compose up -d --build
          echo "Esperando arranque de los servicios (90s)..."
          sleep 90
          docker compose ps
          echo "--- Logs microservice-b ---"
          docker compose logs --tail=30 microservice-b || true
          echo "--- Logs microservice-a ---"
          docker compose logs --tail=50 microservice-a || true

      - name: "Deliver · Health check microservice-b"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18081/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "microservice-b UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "microservice-b no arranco"
            cd simulation && docker compose logs microservice-b
            exit 1
          fi

      - name: "Deliver · Health check microservice-a"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "microservice-a UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            echo "microservice-a no arranco"
            cd simulation && docker compose logs microservice-a
            exit 1
          fi

      - name: "Deliver · DEMO BREAK 2 - Karate E2E · Flujo Completo 8 Pasos"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci -Dtest=RecargaFlowRunner#testRecargaFlow \
            --no-transfer-progress

      - name: "Deliver · Subir informe Karate"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karate-e2e-report-${{ env.OVERLAY }}-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/
          retention-days: 14

      - name: "Deliver · Selenium validacion UI"
        run: |
          cd tests/ui-selenium
          mvn test -Dapp.url=http://localhost:8080 --no-transfer-progress
        continue-on-error: true

      - name: "Deliver · k6 smoke test performance"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: "Deliver · Parar ambiente"
        if: always()
        run: cd simulation && docker compose down -v

      - name: "Deliver · GitOps actualizar manifiesto: ${{ inputs.microservice_name }} en ${{ env.OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys
          overlay  = os.environ['OVERLAY']
          new_tag  = os.environ['IMAGE_TAG']
          ms_name  = '${{ inputs.microservice_name }}'
          filepath = f'k8s/overlays/{overlay}/kustomization.yaml'
          registry = 'ghcr.io/optaresolutions/mx-poc-paymentapp'

          with open(filepath) as f:
              content = f.read()

          pattern     = rf'(- name: {re.escape(registry)}/{ms_name}\n\s+newTag:)[^\n]*'
          replacement = rf'\1 "{new_tag}"'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              print(f'Patron no encontrado en {filepath}', file=sys.stderr)
              sys.exit(1)

          with open(filepath, 'w') as f:
              f.write(new_content)
          print(f'{ms_name}: {new_tag} -> k8s/overlays/{overlay}/kustomization.yaml')
          EOF

      - name: "Deliver · Git commit + push manifiesto actualizado [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops(${{ inputs.microservice_name }}): ${IMAGE_TAG} -> ${ENV_NAME} [skip ci]"
          # Retry loop: pull --rebase before each push to handle concurrent GitOps pushes
          n=0
          until [ $n -ge 5 ]; do
            git pull --rebase && git push && break
            n=$((n + 1))
            echo "Push attempt $n failed, retrying in $((n * 2))s..."
            sleep $((n * 2))
          done
          [ $n -lt 5 ] || { echo "GitOps push failed after 5 attempts"; exit 1; }

      - name: "Deliver · ArgoCD (simulado) sync ${{ env.ENV_NAME }}"
        run: |
          echo "---------------------------------------------------------------"
          echo "[ArgoCD] Cambio detectado en k8s/overlays/${OVERLAY}/"
          echo "[ArgoCD] Application: att-paymentbox-${OVERLAY}"
          echo "[ArgoCD] Servicio:    ${{ inputs.microservice_name }}"
          echo "[ArgoCD] Nueva imagen: ghcr.io/.../${{ inputs.microservice_name }}:${IMAGE_TAG}"
          echo "[ArgoCD] Entorno:     ${ENV_NAME}"
          echo "[ArgoCD] Sync strategy: Apply (Prune=true, SelfHeal=true)"
          sleep 2
          echo "[ArgoCD] Sync completado - ${{ inputs.microservice_name }} desplegado en ${ENV_NAME}"
          echo "[ArgoCD] Endpoint: http://${{ inputs.microservice_name }}.${OVERLAY}.att-paymentbox.internal"
          echo "---------------------------------------------------------------"

# ------------------------------------------------------------------------------
# JOB 5b – Deliver (Smoke Test + GitOps Deploy · microservice-b)
# Runs when test_runner == 'smoke'
# ------------------------------------------------------------------------------
  smoke-gitops:
    name: "5 · Deliver · Smoke + GitOps [${{ needs.publish.outputs.env-name }}]"
    needs: [publish, deploy-ready]
    if: >-
      ${{ always() && inputs.test_runner == 'smoke' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.publish.result == 'success' &&
      needs.deploy-ready.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image-tag }}
      OVERLAY:   ${{ needs.publish.outputs.env-overlay }}
      ENV_NAME:  ${{ needs.publish.outputs.env-name }}

    services:
      db-simulado:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: att_paymentbox
          POSTGRES_USER: att_user
          POSTGRES_PASSWORD: att_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U att_user -d att_paymentbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Deliver · Checkout source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Deliver · Configurar JDK 17"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin

      - name: "Deliver · Aplicar schema TDM y seeders Billy"
        env:
          PGPASSWORD: att_pass
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/01_schema.sql
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/02_billy_profiles.sql

      - name: "Deliver · Download JAR ${{ inputs.microservice_name }}"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.microservice_name }}-jar-${{ github.run_id }}
          path: ${{ inputs.microservice_name }}/build/libs/

      - name: "Deliver · Iniciar ${{ inputs.microservice_name }} (smoke test local)"
        run: |
          java -jar ${{ inputs.microservice_name }}/build/libs/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/att_paymentbox \
            --spring.datasource.username=att_user \
            --spring.datasource.password=att_pass \
            --server.port=8081 &
          echo "Esperando arranque de ${{ inputs.microservice_name }}..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            [ "$STATUS" -eq "200" ] && echo "${{ inputs.microservice_name }} UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then echo "${{ inputs.microservice_name }} no arranco" && exit 1; fi

      - name: "Deliver · Smoke test contrato publico (/api/customers/4544)"
        run: |
          RESP=$(curl -sf http://localhost:8081/api/customers/4544)
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'phone' in data, 'FAIL: campo phone ausente (contrato roto?)'
          assert 'fullName' in data, 'FAIL: campo fullName ausente (contrato roto?)'
          assert 'status'   in data, 'FAIL: campo status ausente'
          assert data['phone'] == '4544', f'FAIL: phone={data[\"phone\"]}'
          print('Smoke test OK - campos del contrato presentes')
          "

      - name: "Deliver · GitOps actualizar manifiesto: ${{ inputs.microservice_name }} en ${{ env.OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys
          overlay  = os.environ['OVERLAY']
          new_tag  = os.environ['IMAGE_TAG']
          ms_name  = '${{ inputs.microservice_name }}'
          filepath = f'k8s/overlays/{overlay}/kustomization.yaml'
          registry = 'ghcr.io/optaresolutions/mx-poc-paymentapp'

          with open(filepath) as f:
              content = f.read()

          pattern     = rf'(- name: {re.escape(registry)}/{ms_name}\n\s+newTag:)[^\n]*'
          replacement = rf'\1 "{new_tag}"'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              print(f'Patron no encontrado en {filepath}', file=sys.stderr)
              sys.exit(1)

          with open(filepath, 'w') as f:
              f.write(new_content)
          print(f'{ms_name}: {new_tag} -> k8s/overlays/{overlay}/kustomization.yaml')
          EOF

      - name: "Deliver · Git commit + push manifiesto actualizado [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops(${{ inputs.microservice_name }}): ${IMAGE_TAG} -> ${ENV_NAME} [skip ci]"
          # Retry loop: pull --rebase before each push to handle concurrent GitOps pushes
          n=0
          until [ $n -ge 5 ]; do
            git pull --rebase && git push && break
            n=$((n + 1))
            echo "Push attempt $n failed, retrying in $((n * 2))s..."
            sleep $((n * 2))
          done
          [ $n -lt 5 ] || { echo "GitOps push failed after 5 attempts"; exit 1; }

      - name: "Deliver · ArgoCD (simulado) sync ${{ env.ENV_NAME }}"
        run: |
          echo "---------------------------------------------------------------"
          echo "[ArgoCD] Cambio detectado en k8s/overlays/${OVERLAY}/"
          echo "[ArgoCD] Application: att-paymentbox-${OVERLAY}"
          echo "[ArgoCD] Servicio:    ${{ inputs.microservice_name }}"
          echo "[ArgoCD] Nueva imagen: ghcr.io/.../${{ inputs.microservice_name }}:${IMAGE_TAG}"
          echo "[ArgoCD] Entorno:     ${ENV_NAME}"
          sleep 2
          echo "[ArgoCD] Sync completado - ${{ inputs.microservice_name }} desplegado en ${ENV_NAME}"
          echo "---------------------------------------------------------------"
