name: "[API] Test · Smoke Tests Funcionales — AT&T PoC"

# ──────────────────────────────────────────────────────────────────────────────
# Propósito: Ejecutar smoke tests funcionales sobre los endpoints críticos de
#            la API (microservice-a y microservice-b) para validar que el
#            entorno está operativo y los contratos básicos se cumplen.
#
# Cobertura:
#   - GET  /api/clientes/buscar          → Paso 2: clientes activos (Billy 1-3)
#   - GET  /api/recargas/montos          → Paso 3: montos disponibles
#   - POST /api/recargas/validar-operador → Paso 4: validación operador (Prism)
#   - GET  /api/pagos/metodos            → Paso 5: métodos de pago
#   - POST /api/pagos/registrar          → Pasos 6 & 7: registro de pago
#   - POST /api/recibos/emitir           → Paso 8: emisión de recibo (Prism)
#   - GET  /api/customers/{telefono}     → Contrato microservice-b
#   - Ruta crítica end-to-end (8 pasos encadenados)
#
# Resultados: visibles como artifacts (HTML) en cada ejecución de GitHub Actions
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop, qa, uat]
    paths:
      - 'microservice-a/**'
      - 'microservice-b/**'
      - 'tests/functional-karate/**'
      - 'simulation/**'
      - '.github/workflows/api-smoke-tests.yml'
  pull_request:
    branches: [develop, qa, uat]
    paths:
      - 'microservice-a/**'
      - 'microservice-b/**'
      - 'tests/functional-karate/**'
      - 'simulation/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno objetivo (local/ci)"
        required: false
        default: "ci"

permissions:
  contents: read

concurrency:
  group: api-smoke-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  api-smoke-tests:
    name: "2 · Test · API Smoke Tests — Endpoints Críticos"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "Test · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # ── 2. Configurar JDK 17 para Karate/Maven ──────────────────────────────
      - name: "Test · Configurar JDK 17"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # ── 3. Cache Maven (~/.m2) ───────────────────────────────────────────────
      - name: "Test · Cache Maven"
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-smoke-${{ hashFiles('tests/functional-karate/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-smoke-
            ${{ runner.os }}-maven-

      # ── 4. Iniciar entorno simulado (docker-compose) ─────────────────────────
      - name: "Test · Iniciar entorno simulado"
        run: |
          cd simulation
          docker compose up -d --build
          echo "⏳ Esperando arranque de servicios (90s)..."
          sleep 90
          docker compose ps

      # ── 5. Health check microservice-b ───────────────────────────────────────
      - name: "Test · Health check — microservice-b"
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18081/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "✅ microservice-b UP" && break
            [ "$i" -eq "15" ] && echo "❌ microservice-b no arrancó" && \
              cd simulation && docker compose logs microservice-b && exit 1
            sleep 5
          done

      # ── 6. Health check microservice-a ───────────────────────────────────────
      - name: "Test · Health check — microservice-a"
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            [ "$STATUS" -eq "200" ] && echo "✅ microservice-a UP" && break
            [ "$i" -eq "15" ] && echo "❌ microservice-a no arrancó" && \
              cd simulation && docker compose logs microservice-a && exit 1
            sleep 5
          done

      # ── 7. Ejecutar Karate Smoke Tests (@smoke) ───────────────────────────────
      - name: "Test · Ejecutar API Smoke Tests (Karate @smoke)"
        working-directory: tests/functional-karate
        run: |
          mvn test \
            -Dkarate.env=ci \
            -Dtest=RecargaFlowRunner#testSmoke \
            --no-transfer-progress \
            -Dsurefire.failIfNoSpecifiedTests=false

      # ── 8. Publicar resultados JUnit en GitHub Actions ────────────────────────
      - name: "Test · Publicar resultados de tests"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-smoke-results-${{ github.run_id }}
          path: |
            tests/functional-karate/target/surefire-reports/
            tests/functional-karate/target/karate-reports/
          retention-days: 30

      # ── 9. Resumen de resultados en el Job Summary ────────────────────────────
      - name: "Test · Resumen de resultados"
        if: always()
        run: |
          echo "## 🧪 API Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | Rama | Run |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ github.ref_name }} | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints validados" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET  /api/clientes/buscar\` — Paso 2: clientes activos Billy 1-3" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET  /api/recargas/montos\` — Paso 3: montos disponibles" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/recargas/validar-operador\` — Paso 4: validación operador" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET  /api/pagos/metodos\` — Paso 5: métodos de pago" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/pagos/registrar\` — Pasos 6 & 7: registro pago" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/recibos/emitir\` — Paso 8: emisión recibo" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET  /api/customers/{telefono}\` — Contrato microservice-b" >> $GITHUB_STEP_SUMMARY
          echo "- Ruta crítica end-to-end (8 pasos encadenados)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Mostrar resultados si existen
          if ls tests/functional-karate/target/surefire-reports/*.xml 2>/dev/null; then
            PASSED=$(grep -r "tests=" tests/functional-karate/target/surefire-reports/*.xml \
              | grep -oP 'tests="\K[0-9]+' | awk '{s+=$1} END {print s}' || echo "?")
            FAILED=$(grep -r "failures=" tests/functional-karate/target/surefire-reports/*.xml \
              | grep -oP 'failures="\K[0-9]+' | awk '{s+=$1} END {print s}' || echo "?")
            echo "### Resumen: ✅ $PASSED pasados | ❌ $FAILED fallidos" >> $GITHUB_STEP_SUMMARY
          fi

      # ── 10. Parar entorno simulado ────────────────────────────────────────────
      - name: "Test · Parar entorno simulado"
        if: always()
        run: cd simulation && docker compose down -v
