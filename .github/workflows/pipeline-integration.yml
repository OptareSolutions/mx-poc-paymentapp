name: "🔗 Pipeline Integración — Contrato · E2E · Promoción entre Ambientes"

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: MANUAL (workflow_dispatch) — promoción deliberada entre ambientes
#
# Mejoras v2 (basadas en patrones de mxapm0002577-source-identity-connector):
#   - Gitleaks antes de cualquier prueba de integración
#   - Eliminado sleep fijo → health check loops puros
#   - Maven cache para Karate y Selenium
#   - Selenium incluido en E2E full (faltaba en v1)
#   - Selenium con continue-on-error: false (antes silenciosamente fallaba)
#   - Summary enriquecido con GITHUB_STEP_SUMMARY
#   - Validación de combinación de ambientes mejorada con mensajes claros
#   - Job de notificación final con resumen completo
#
# Flujo de promoción (dev → qa → preprod → prod):
#   dev     → qa      (env-e → env-a)
#   qa      → preprod (env-a → env-f)
#   preprod → prod    (env-f → prod)
#
# Gates declarativos:
#   Job 1 — Tests de Contrato entre servicios  (⚠️ DEMO BREAK 1: falla aquí)
#   Job 2 — E2E completo + Selenium + k6
#   Job 3 — Promoción GitOps (solo si Jobs 1+2 verdes)
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      promote_from:
        description: "Ambiente de ORIGEN (rama)"
        required: true
        type: choice
        options: [E, A, F]
      promote_to:
        description: "Ambiente de DESTINO (rama)"
        required: true
        type: choice
        options: [A, F, PRODUCCION]
      skip_e2e:
        description: "Omitir E2E completo (solo contrato)"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: "21"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 0 — Validar inputs y mapear ambientes
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: "0 — Validar Promoción ${{ inputs.promote_from }} → ${{ inputs.promote_to }}"
    runs-on: ubuntu-latest
    outputs:
      from-overlay: ${{ steps.mapping.outputs.from_overlay }}
      to-overlay:   ${{ steps.mapping.outputs.to_overlay }}
      from-name:    ${{ steps.mapping.outputs.from_name }}
      to-name:      ${{ steps.mapping.outputs.to_name }}

    steps:
      - name: Validar combinación de ambientes
        run: |
          FROM="${{ inputs.promote_from }}"
          TO="${{ inputs.promote_to }}"
          VALID=false
          [ "$FROM" = "E" ] && [ "$TO" = "A"          ] && VALID=true
          [ "$FROM" = "A" ] && [ "$TO" = "F"          ] && VALID=true
          [ "$FROM" = "F" ] && [ "$TO" = "PRODUCCION" ] && VALID=true
          if [ "$VALID" = "false" ]; then
            echo "❌ Combinación inválida: ${FROM} → ${TO}"
            echo ""
            echo "Combinaciones válidas (flujo: E → A → F → PRODUCCION):"
            echo "  E → A           (Desarrollo → QA)"
            echo "  A → F           (QA → Pre-producción)"
            echo "  F → PRODUCCION  (Pre-producción → Producción)"
            exit 1
          fi
          echo "✅ Promoción válida: ${FROM} → ${TO}"

      - name: Mapear ambientes y overlays
        id: mapping
        run: |
          case "${{ inputs.promote_from }}" in
            E)          echo "from_overlay=env-e" >> $GITHUB_OUTPUT ; echo "from_name=E (Desarrollo)"     >> $GITHUB_OUTPUT ;;
            A)          echo "from_overlay=env-a" >> $GITHUB_OUTPUT ; echo "from_name=A (QA)"             >> $GITHUB_OUTPUT ;;
            F)          echo "from_overlay=env-f" >> $GITHUB_OUTPUT ; echo "from_name=F (Pre-producción)" >> $GITHUB_OUTPUT ;;
          esac
          case "${{ inputs.promote_to }}" in
            A)          echo "to_overlay=env-a" >> $GITHUB_OUTPUT ; echo "to_name=A (QA)"             >> $GITHUB_OUTPUT ;;
            F)          echo "to_overlay=env-f" >> $GITHUB_OUTPUT ; echo "to_name=F (Pre-producción)" >> $GITHUB_OUTPUT ;;
            PRODUCCION) echo "to_overlay=prod"  >> $GITHUB_OUTPUT ; echo "to_name=Producción"          >> $GITHUB_OUTPUT ;;
          esac

      - name: Resumen de la promoción
        run: |
          echo "## 🔍 Promoción iniciada" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Origen | ${{ inputs.promote_from }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destino | ${{ inputs.promote_to }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Omitir E2E | ${{ inputs.skip_e2e }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Iniciado por | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Tests de Contrato entre Servicios
# ⚠️ DEMO BREAK 1: falla aquí cuando microservice-b tiene campos renombrados
# Mejora v2: sin sleep fijo, Maven cache, health check mejorado
# ──────────────────────────────────────────────────────────────────────────────
  contract-tests:
    name: "1 — ⚠️ DEMO BREAK 1 — Tests Contrato [${{ needs.validate.outputs.from-name }}]"
    runs-on: ubuntu-latest
    needs: validate

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Karate)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven (Karate)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('tests/functional-karate/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Leer tags de imagen del overlay ${{ env.FROM_OVERLAY }}
        id: read-tags
        run: |
          KUSTOMIZE="k8s/overlays/${FROM_OVERLAY}/kustomization.yaml"
          echo "=== Manifiesto actual de ${FROM_OVERLAY} ==="
          cat "$KUSTOMIZE"
          echo ""
          TAG_A=$(grep -A1 'mx-poc-paymentapp/microservice-a' "$KUSTOMIZE" | grep newTag | sed 's/.*newTag: *"//' | sed 's/".*//' | tr -d ' ')
          TAG_B=$(grep -A1 'mx-poc-paymentapp/microservice-b' "$KUSTOMIZE" | grep newTag | sed 's/.*newTag: *"//' | sed 's/".*//' | tr -d ' ')
          echo "microservice-a tag: ${TAG_A}"
          echo "microservice-b tag: ${TAG_B}"
          echo "tag_a=${TAG_A}" >> $GITHUB_OUTPUT
          echo "tag_b=${TAG_B}" >> $GITHUB_OUTPUT

      - name: Pull imágenes del entorno ${{ env.FROM_NAME }}
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:${{ steps.read-tags.outputs.tag_a }} || \
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:${{ steps.read-tags.outputs.tag_b }} || \
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:latest

      - name: Iniciar Entorno para Contrato (docker-compose)
        env:
          MSVC_A_TAG: ${{ steps.read-tags.outputs.tag_a }}
          MSVC_B_TAG: ${{ steps.read-tags.outputs.tag_b }}
        run: |
          cd simulation
          MSVC_A_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:${MSVC_A_TAG:-latest}"
          MSVC_B_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:${MSVC_B_TAG:-latest}"
          echo "Usando microservice-a: ${MSVC_A_IMAGE}"
          echo "Usando microservice-b: ${MSVC_B_IMAGE}"
          MICROSERVICE_A_IMAGE="$MSVC_A_IMAGE" MICROSERVICE_B_IMAGE="$MSVC_B_IMAGE" \
            docker compose up -d db-simulado mock-operador mock-recibo microservice-b microservice-a --no-build

      - name: Health Check microservice-b
        run: |
          echo "⏳ Esperando microservice-b..."
          for i in {1..24}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health 2>/dev/null || echo "000")
            echo "  Intento $i/24: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "✅ microservice-b UP" && break
            [ "$i" = "24" ] && echo "❌ Timeout" && cd simulation && docker compose logs microservice-b && exit 1
            sleep 5
          done

      - name: Health Check microservice-a
        run: |
          echo "⏳ Esperando microservice-a..."
          for i in {1..24}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            echo "  Intento $i/24: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "✅ microservice-a UP" && break
            [ "$i" = "24" ] && echo "❌ Timeout" && cd simulation && docker compose logs microservice-a && exit 1
            sleep 5
          done

      - name: "⚠️ DEMO BREAK 1 — Karate Contrato: microservice-a → microservice-b"
        run: |
          echo "🔍 Validando contrato público de microservice-b..."
          echo "   Campos esperados: 'telefono', 'nombre', 'status'"
          cd tests/functional-karate
          mvn test -Dkarate.env=ci \
            -Dtest=RecargaFlowRunner#testContratoMicroservicios \
            --no-transfer-progress --batch-mode

      - name: Subir Informe Contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-report-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/
          retention-days: 14

      - name: Parar Ambiente
        if: always()
        run: cd simulation && docker compose down -v

      - name: Resumen de contrato
        if: always()
        run: |
          echo "## 🔗 Tests de Contrato" >> $GITHUB_STEP_SUMMARY
          echo "| Servicio | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| microservice-a → microservice-b | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente origen | ${{ env.FROM_NAME }} |" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — E2E Completo (Karate + Selenium + k6)
# Mejora v2: Selenium incluido y bloqueante, Maven cache, sin sleep fijo
# ──────────────────────────────────────────────────────────────────────────────
  e2e-full:
    name: "2 — E2E Completo — Karate + Selenium + k6 [${{ needs.validate.outputs.from-name }}]"
    runs-on: ubuntu-latest
    needs: [validate, contract-tests]
    if: ${{ !inputs.skip_e2e }}

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven (Karate + Selenium)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('tests/functional-karate/pom.xml', 'tests/ui-selenium/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar Entorno Completo (docker-compose)
        run: |
          cd simulation
          docker compose pull microservice-a microservice-b || true
          docker compose up -d --no-build

      - name: Health Checks (microservice-b y microservice-a)
        run: |
          for SVC in "microservice-b:http://localhost:8081/actuator/health" "microservice-a:http://localhost:8080/actuator/health"; do
            SVC_NAME="${SVC%%:*}"
            SVC_URL="${SVC#*:}"
            echo "⏳ Esperando ${SVC_NAME}..."
            for i in {1..24}; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$SVC_URL" 2>/dev/null || echo "000")
              echo "  Intento $i/24: HTTP $STATUS"
              [ "$STATUS" = "200" ] && echo "✅ ${SVC_NAME} UP" && break
              [ "$i" = "24" ] && echo "❌ ${SVC_NAME} no respondió" \
                && cd simulation && docker compose logs "${SVC_NAME}" && exit 1
              sleep 5
            done
          done

      - name: "Karate E2E — Flujo Completo 8 Pasos"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci \
            -Dtest=RecargaFlowRunner#testRecargaFlow \
            --no-transfer-progress --batch-mode

      - name: Subir Informe Karate E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-karate-report-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/
          retention-days: 14

      - name: "Selenium — Validación UI (bloqueante)"
        run: |
          cd tests/ui-selenium
          mvn test -Dapp.url=http://localhost:8080 --no-transfer-progress --batch-mode
        continue-on-error: false

      - name: Subir Informe Selenium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-selenium-report-${{ github.run_id }}
          path: tests/ui-selenium/target/surefire-reports/
          retention-days: 14

      - name: "k6 Smoke Test — Performance Ruta Crítica"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6
          mkdir -p tests/k6/results
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: Subir Resultados k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-k6-results-${{ github.run_id }}
          path: tests/k6/results/
          retention-days: 14

      - name: Parar Ambiente
        if: always()
        run: cd simulation && docker compose down -v

      - name: Resumen E2E
        if: always()
        run: |
          echo "## 🧪 E2E Completo" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Karate 8 pasos | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium UI | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| k6 Smoke (p95<2s) | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Promoción GitOps
# Solo ejecuta si Jobs 1 y 2 pasan — protección total del ambiente destino
# ──────────────────────────────────────────────────────────────────────────────
  promote:
    name: "3 — GitOps Promoción ${{ needs.validate.outputs.from-name }} → ${{ needs.validate.outputs.to-name }}"
    runs-on: ubuntu-latest
    needs: [validate, contract-tests, e2e-full]
    if: always() && needs.contract-tests.result == 'success' && (needs.e2e-full.result == 'success' || inputs.skip_e2e)
    permissions:
      contents: write

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      TO_OVERLAY:   ${{ needs.validate.outputs.to-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}
      TO_NAME:      ${{ needs.validate.outputs.to-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Copiar tags de ${{ env.FROM_OVERLAY }} → ${{ env.TO_OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys

          REGISTRY = 'ghcr.io/optaresolutions/mx-poc-paymentapp'
          SERVICES = ['microservice-a', 'microservice-b', 'ui-paymentbox']
          from_ovl  = os.environ['FROM_OVERLAY']
          to_ovl    = os.environ['TO_OVERLAY']
          from_name = os.environ['FROM_NAME']
          to_name   = os.environ['TO_NAME']

          src_path = f'k8s/overlays/{from_ovl}/kustomization.yaml'
          tgt_path = f'k8s/overlays/{to_ovl}/kustomization.yaml'

          with open(src_path) as f:
              src = f.read()
          with open(tgt_path) as f:
              tgt = f.read()

          print(f'🚀 Promoviendo {from_name} → {to_name}')
          print(f'   Origen:  {src_path}')
          print(f'   Destino: {tgt_path}')
          print()

          promoted = []
          for svc in SERVICES:
              m = re.search(
                  rf'- name: {re.escape(REGISTRY)}/{svc}\n\s+newTag: "?([^"\n]+)"?',
                  src
              )
              if m:
                  tag = m.group(1)
                  pattern     = rf'(- name: {re.escape(REGISTRY)}/{svc}\n\s+newTag:)[^\n]*'
                  replacement = rf'\1 "{tag}"'
                  new_tgt     = re.sub(pattern, replacement, tgt)
                  if new_tgt != tgt:
                      tgt = new_tgt
                      promoted.append(f'{svc}: {tag}')
                      print(f'  ✅ {svc}: {tag}')
                  else:
                      print(f'  ⚠️  {svc}: patrón no encontrado en el destino', file=sys.stderr)
              else:
                  print(f'  ℹ️  {svc}: tag no encontrada en el origen (puede no estar en este overlay)')

          with open(tgt_path, 'w') as f:
              f.write(tgt)

          print()
          print(f'✅ Promoción completada: {len(promoted)} servicios actualizados')
          print('=== Manifiesto destino ===')
          print(tgt)
          EOF

      - name: "Git commit + push — promoción GitOps [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.TO_OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios que promocionar" && exit 0
          git commit -m "gitops: promover ${FROM_OVERLAY} → ${TO_OVERLAY} (${FROM_NAME} → ${TO_NAME}) [skip ci]"
          git push

      - name: "ArgoCD (simulado) — Sync ${{ env.TO_NAME }}"
        run: |
          echo "──────────────────────────────────────────────────────────"
          echo "🚀 [ArgoCD] Promoción detectada:"
          echo "   Origen:  ${FROM_NAME} (${FROM_OVERLAY})"
          echo "   Destino: ${TO_NAME} (${TO_OVERLAY})"
          echo ""
          echo "🔄 [ArgoCD] Sincronizando application att-paymentbox-${TO_OVERLAY}..."
          echo "⚙️  [ArgoCD] Strategy: Sync (Prune=true, SelfHeal=true)"
          sleep 3
          echo ""
          echo "✅ [ArgoCD] Sync COMPLETADO"
          echo "   microservice-a → desplegado en ${TO_NAME}"
          echo "   microservice-b → desplegado en ${TO_NAME}"
          echo "   ui-paymentbox  → desplegado en ${TO_NAME}"
          echo ""
          echo "🌐 Endpoints simulados ${TO_NAME}:"
          echo "   API: http://microservice-a.${TO_OVERLAY}.att-paymentbox.internal"
          echo "   UI:  http://ui.${TO_OVERLAY}.att-paymentbox.internal"
          echo "──────────────────────────────────────────────────────────"

      - name: Resumen de la Promoción
        run: |
          echo "## 🎉 Promoción Completada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Origen | ${{ env.FROM_NAME }} (\`${{ env.FROM_OVERLAY }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Destino | ${{ env.TO_NAME }} (\`${{ env.TO_OVERLAY }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Contrato | ✅ Pasaron |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Completo | ${{ inputs.skip_e2e && '⏭️ Omitido' || '✅ Pasaron' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium UI | ${{ inputs.skip_e2e && '⏭️ Omitido' || '✅ Pasaron' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitOps | ✅ Manifiesto actualizado |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | ✅ Sync simulado |" >> $GITHUB_STEP_SUMMARY
          echo "| Aprobado por | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
