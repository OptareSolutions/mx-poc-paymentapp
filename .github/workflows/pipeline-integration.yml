name: "Pipeline Integracion · Build · Test · Quality Gates · Deliver"

# ------------------------------------------------------------------------------
# Trigger: MANUAL (workflow_dispatch) — promoción deliberada entre ambientes
#
# Flujo (solo combinaciones secuenciales):
#   E → A           (env-e → env-a)
#   A → F           (env-a → env-f)
#   F → PRODUCCION  (env-f → prod)
#
# Gates declarativos:
#   Job de contrato — Karate inter-servicios (DEMO BREAK 1 puede fallar aquí)
#   E2E completo con entorno simulado
#   Promoción GitOps + ArgoCD simulado (solo si los gates previos pasan)
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      promote_from:
        description: "Ambiente de ORIGEN (rama)"
        required: true
        type: choice
        options: [E, A, F]
      promote_to:
        description: "Ambiente de DESTINO (rama)"
        required: true
        type: choice
        options: [A, F, PRODUCCION]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read  # default: read-only; individual jobs override as needed

# ------------------------------------------------------------------------------
# JOB 1 � Validar inputs de promoci�n
# ------------------------------------------------------------------------------
jobs:
  validate:
    name: "1 · Build · Validar promocion ${{ inputs.promote_from }} -> ${{ inputs.promote_to }}"
    runs-on: ubuntu-latest
    outputs:
      from-overlay: ${{ steps.mapping.outputs.from_overlay }}
      to-overlay:   ${{ steps.mapping.outputs.to_overlay }}
      from-name:    ${{ steps.mapping.outputs.from_name }}
      to-name:      ${{ steps.mapping.outputs.to_name }}

    steps:
      - name: "Build · Validar combinacion de ambientes"
        run: |
          FROM="${{ inputs.promote_from }}"
          TO="${{ inputs.promote_to }}"
          VALID=false
          [ "$FROM" = "E" ] && [ "$TO" = "A" ] && VALID=true
          [ "$FROM" = "A" ] && [ "$TO" = "F" ] && VALID=true
          [ "$FROM" = "F" ] && [ "$TO" = "PRODUCCION" ] && VALID=true
          if [ "$VALID" = "false" ]; then
            echo "::error::Combinacion invalida: ${FROM} -> ${TO}"
            echo "   Validas: E->A | A->F | F->PRODUCCION"
            exit 1
          fi
          echo "OK Promocion valida: ${FROM} -> ${TO}"

      - name: "Build · Mapear ambientes y overlays"
        id: mapping
        run: |
          case "${{ inputs.promote_from }}" in
            E) echo "from_overlay=env-e" >> $GITHUB_OUTPUT ; echo "from_name=E (Desarrollo)" >> $GITHUB_OUTPUT ;;
            A) echo "from_overlay=env-a" >> $GITHUB_OUTPUT ; echo "from_name=A (QA)"         >> $GITHUB_OUTPUT ;;
            F) echo "from_overlay=env-f" >> $GITHUB_OUTPUT ; echo "from_name=F (Preprod)"    >> $GITHUB_OUTPUT ;;
          esac
          case "${{ inputs.promote_to }}" in
            A)          echo "to_overlay=env-a" >> $GITHUB_OUTPUT ; echo "to_name=A (QA)"      >> $GITHUB_OUTPUT ;;
            F)          echo "to_overlay=env-f" >> $GITHUB_OUTPUT ; echo "to_name=F (Preprod)" >> $GITHUB_OUTPUT ;;
            PRODUCCION) echo "to_overlay=prod"  >> $GITHUB_OUTPUT ; echo "to_name=Produccion"  >> $GITHUB_OUTPUT ;;
          esac

# ------------------------------------------------------------------------------
# JOB 2 � Tests de Contrato entre Servicios
# ??  DEMO BREAK 1: falla aqu� cuando microservice-b tiene campos renombrados
#     (telefono?phone / nombre?fullName) y la imagen env-e est� en el GHCR
# ------------------------------------------------------------------------------
  contract-tests:
    name: "3 · Quality Gates · Tests Contrato [${{ needs.validate.outputs.from-name }}]"
    runs-on: ubuntu-latest
    needs: validate

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}

    steps:
      - name: "Quality Gates · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Quality Gates · Configurar JDK 17 (Karate)"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: "Quality Gates · Cache Maven (~/.m2/repository)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('tests/functional-karate/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: "Quality Gates · Login GHCR"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Quality Gates · Leer tags de imagen del overlay ${{ env.FROM_OVERLAY }}"
        id: read-tags
        run: |
          KUSTOMIZE="k8s/overlays/${FROM_OVERLAY}/kustomization.yaml"
          echo "=== Manifiesto actual de ${FROM_OVERLAY} ==="
          cat "$KUSTOMIZE"
          echo ""
          TAG_A=$(grep -A1 'mx-poc-paymentapp/microservice-a' "$KUSTOMIZE" | grep newTag | sed 's/.*newTag: *"//' | sed 's/".*//' | tr -d ' ')
          TAG_B=$(grep -A1 'mx-poc-paymentapp/microservice-b' "$KUSTOMIZE" | grep newTag | sed 's/.*newTag: *"//' | sed 's/".*//' | tr -d ' ')
          echo "microservice-a tag: ${TAG_A}"
          echo "microservice-b tag: ${TAG_B}"
          echo "tag_a=${TAG_A}" >> $GITHUB_OUTPUT
          echo "tag_b=${TAG_B}" >> $GITHUB_OUTPUT

      - name: "Quality Gates · Pull imagenes del entorno ${{ env.FROM_NAME }} para test de contrato"
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:${{ steps.read-tags.outputs.tag_a }} || \
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:${{ steps.read-tags.outputs.tag_b }} || \
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:latest

      - name: "Quality Gates · Iniciar Entorno para Contrato (docker-compose)"
        env:
          MSVC_A_TAG: ${{ steps.read-tags.outputs.tag_a }}
          MSVC_B_TAG: ${{ steps.read-tags.outputs.tag_b }}
        run: |
          cd simulation
          # Sobreescribir las tags espec�ficas del entorno de origen
          MSVC_A_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/microservice-a:${MSVC_A_TAG:-latest}"
          MSVC_B_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/microservice-b:${MSVC_B_TAG:-latest}"
          echo "Usando microservice-a: ${MSVC_A_IMAGE}"
          echo "Usando microservice-b: ${MSVC_B_IMAGE}"
          # Override de las im�genes v�a variables de entorno de docker compose
          MICROSERVICE_A_IMAGE="$MSVC_A_IMAGE" MICROSERVICE_B_IMAGE="$MSVC_B_IMAGE" \
            docker compose up -d db-simulado mock-operador mock-recibo microservice-b microservice-a --no-build
          echo "? Esperando arranque de los servicios (90s)..."
          sleep 90
          docker compose ps

      - name: "Quality Gates · Health Check microservice-b (imagen ${{ env.FROM_NAME }})"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            [ "$STATUS" -eq "200" ] && echo "? microservice-b UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            cd simulation && docker compose logs microservice-b
            exit 1
          fi

      - name: "Quality Gates · Health Check microservice-a"
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            [ "$STATUS" -eq "200" ] && echo "? microservice-a UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then
            cd simulation && docker compose logs microservice-a
            exit 1
          fi

      - name: "Quality Gates · DEMO BREAK 1 · Karate Contrato microservice-a -> microservice-b"
        run: |
          echo "?? Validando contrato p�blico de microservice-b..."
          echo "   Campos esperados: 'telefono', 'nombre', 'status'"
          cd tests/functional-karate
          mvn test -Dkarate.env=ci \
            -Dtest=RecargaFlowRunner#testContratoMicroservicios \
            --no-transfer-progress

      - name: "Quality Gates · Subir Informe Contrato"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-report-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/

      - name: "Quality Gates · Parar Ambiente"
        if: always()
        run: cd simulation && docker compose down -v

# ------------------------------------------------------------------------------
# JOB 3 � E2E Completo
# ------------------------------------------------------------------------------
  e2e-full:
    name: "2 · Test · E2E Completo · Karate 8 Pasos + k6 [${{ needs.validate.outputs.from-name }}]"
    runs-on: ubuntu-latest
    needs: [validate, contract-tests]

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}

    steps:
      - name: "Test · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Test · Configurar JDK 17"
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: "Test · Cache Maven (~/.m2/repository)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('tests/functional-karate/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: "Test · Login GHCR"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Test · Iniciar Entorno Completo (docker-compose)"
        run: |
          cd simulation
          docker compose pull microservice-a microservice-b || true
          docker compose up -d --no-build
          echo "? Esperando arranque (90s)..."
          sleep 90
          docker compose ps

      - name: "Test · Health Checks"
        run: |
          for SVC_URL in http://localhost:8081/actuator/health http://localhost:8080/actuator/health; do
            for i in {1..15}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SVC_URL" || echo "000")
              [ "$STATUS" -eq "200" ] && echo "? ${SVC_URL} UP" && break
              sleep 5
            done
            [ "$STATUS" -ne "200" ] && echo "? ${SVC_URL} no respondi�" && exit 1
          done

      - name: "Test · Karate E2E · Flujo Completo 8 Pasos"
        run: |
          cd tests/functional-karate
          mvn test -Dkarate.env=ci \
            -Dtest=RecargaFlowRunner#testRecargaFlow \
            --no-transfer-progress

      - name: "Test · Subir Informe E2E"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-full-report-${{ github.run_id }}
          path: tests/functional-karate/target/surefire-reports/

      - name: "Test · k6 Smoke Test · Performance"
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6
          k6 run --env BASE_URL=http://localhost:8080 tests/k6/smoke_recarga.js

      - name: "Test · Parar Ambiente"
        if: always()
        run: cd simulation && docker compose down -v

# ------------------------------------------------------------------------------
# JOB 4 � Promoci�n GitOps
# Solo ejecuta si Jobs 2 y 3 pasan � protecci�n total del entorno destino
# ------------------------------------------------------------------------------
  promote:
    name: "5 · Deliver · GitOps Promocion ${{ needs.validate.outputs.from-name }} -> ${{ needs.validate.outputs.to-name }}"
    runs-on: ubuntu-latest
    needs: [validate, contract-tests, e2e-full]
    permissions:
      contents: write

    env:
      FROM_OVERLAY: ${{ needs.validate.outputs.from-overlay }}
      TO_OVERLAY:   ${{ needs.validate.outputs.to-overlay }}
      FROM_NAME:    ${{ needs.validate.outputs.from-name }}
      TO_NAME:      ${{ needs.validate.outputs.to-name }}

    steps:
      - name: "Deliver · Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Deliver · Copiar tags de ${{ env.FROM_OVERLAY }} -> ${{ env.TO_OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys

          REGISTRY = 'ghcr.io/optaresolutions/mx-poc-paymentapp'
          SERVICES = ['microservice-a', 'microservice-b', 'ui-paymentbox']
          from_ovl = os.environ['FROM_OVERLAY']
          to_ovl   = os.environ['TO_OVERLAY']
          from_name = os.environ['FROM_NAME']
          to_name   = os.environ['TO_NAME']

          src_path = f'k8s/overlays/{from_ovl}/kustomization.yaml'
          tgt_path = f'k8s/overlays/{to_ovl}/kustomization.yaml'

          with open(src_path) as f:
              src = f.read()
          with open(tgt_path) as f:
              tgt = f.read()

          print(f'?? Promoviendo {from_name} ? {to_name}')
          print(f'   Origem:  {src_path}')
          print(f'   Destino: {tgt_path}')
          print()

          for svc in SERVICES:
              m = re.search(
                  rf'- name: {re.escape(REGISTRY)}/{svc}\n\s+newTag: "?([^"\n]+)"?',
                  src
              )
              if m:
                  tag = m.group(1)
                  pattern     = rf'(- name: {re.escape(REGISTRY)}/{svc}\n\s+newTag:)[^\n]*'
                  replacement = rf'\1 "{tag}"'
                  new_tgt     = re.sub(pattern, replacement, tgt)
                  if new_tgt != tgt:
                      tgt = new_tgt
                      print(f'  ? {svc}: {tag}')
                  else:
                      print(f'  ??  {svc}: patr�n no encontrado en el destino', file=sys.stderr)
              else:
                  print(f'  ??  {svc}: tag no encontrada en el origen', file=sys.stderr)

          with open(tgt_path, 'w') as f:
              f.write(tgt)

          print()
          print('=== Manifiesto destino actualizado ===')
          print(tgt)
          EOF

      - name: "Deliver · Git commit + push promocion GitOps [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.TO_OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops: promover ${FROM_OVERLAY} ? ${TO_OVERLAY} (${FROM_NAME} ? ${TO_NAME}) [skip ci]"
          git push

      - name: "Deliver · ArgoCD (simulado) Sync ${{ env.TO_NAME }}"
        run: |
          echo "---------------------------------------------------------------"
          echo "?? [ArgoCD] Promoci�n detectada:"
          echo "   Origem:  ${FROM_NAME} (${FROM_OVERLAY})"
          echo "   Destino: ${TO_NAME} (${TO_OVERLAY})"
          echo ""
          echo "?? [ArgoCD] Sincronizando application att-paymentbox-${TO_OVERLAY}..."
          echo "?? [ArgoCD] Strategy: Sync (Prune=true, SelfHeal=true)"
          sleep 3
          echo ""
          echo "? [ArgoCD] Sync COMPLETADO"
          echo "   microservice-a ? desplegado en ${TO_NAME}"
          echo "   microservice-b ? desplegado en ${TO_NAME}"
          echo "   ui-paymentbox  ? desplegado en ${TO_NAME}"
          echo ""
          echo "?? Endpoints simulados ${TO_NAME}:"
          echo "   API:  http://microservice-a.${TO_OVERLAY}.att-paymentbox.internal"
          echo "   UI:   http://ui.${TO_OVERLAY}.att-paymentbox.internal"
          echo "---------------------------------------------------------------"

      - name: "Deliver · Resumen de la Promocion"
        run: |
          echo "## ?? Promoci�n Completada" >> $GITHUB_STEP_SUMMARY
          echo ""                          >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |"         >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|"         >> $GITHUB_STEP_SUMMARY
          echo "| Origem | ${{ env.FROM_NAME }} (\`${{ env.FROM_OVERLAY }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Destino | ${{ env.TO_NAME }} (\`${{ env.TO_OVERLAY }}\`) |"    >> $GITHUB_STEP_SUMMARY
          echo "| Tests Contrato | ? Pasaron |"  >> $GITHUB_STEP_SUMMARY
          echo "| E2E Completo | ? Pasaron |"     >> $GITHUB_STEP_SUMMARY
          echo "| GitOps | ? Manifiesto actualizado |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | ? Sync simulado |"       >> $GITHUB_STEP_SUMMARY
