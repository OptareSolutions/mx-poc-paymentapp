# [microservice-b] CI - Caller para reusable-microservice-pipeline.yml
# Equipo: Customer Profile (Team B) | test_runner: smoke (contract test)
# Ambientes: E->dev | A->qa | F->preprod | PRODUCCION->prod
name: "[microservice-b] CI · Build · Test · Quality Gates · Publish · Deliver"

on:
  push:
    # Post-merge: pipeline completo (Build+Test+QG+Publish+Deploy)
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  pull_request:
    # Pre-merge: Build+Test+QG+Publish (sin Deploy — el if en reusable lo omite)
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  workflow_dispatch:

concurrency:
  group: microservice-b-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: "Build → Test → Quality Gates → Publish → Deliver"
    uses: ./.github/workflows/reusable-microservice-pipeline.yml
    with:
      microservice_name: microservice-b
      image_name: optaresolutions/mx-poc-paymentapp/microservice-b
      test_runner: smoke
    secrets: inherit
