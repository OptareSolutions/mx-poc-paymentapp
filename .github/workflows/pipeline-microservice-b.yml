name: "[microservice-b] CI — Build · Calidad · Seguridad · Deploy"

# ──────────────────────────────────────────────────────────────────────────────
# Equipo: Customer Profile (Team B)
# Stack:  Spring Boot 3.5.3 · Java 21 · Maven · JaCoCo · SonarCloud · Trivy
#
# Referencia de producción: mxapm0002577-source-identity-connector
#   Stack real:  Java 21 · Maven · Golden Image ECR · WireMock · Testcontainers
#   TUH_JAVA_OPTS para tuning JVM en entrypoint.sh
#   Logging estructurado con logstash-logback-encoder + MDC traceId/spanId
#   Resilience4j (circuit breaker + retry) + Spring profiles
#
# Mejoras v3 (migración Maven · Java 21 · Spring Boot 3.5.3):
#   - Java 17 → Java 21 (alineado con identity-connector)
#   - Gradle → Maven (mvn verify, mvn package -DskipTests)
#   - Rutas de artefactos: build/ → target/
#   - JaCoCo: surefireArgLine pattern via pom.xml
#   - OWASP via mvn org.owasp:dependency-check-maven:check
#   - sonar-project.properties generado inline con rutas Maven (target/)
#   - Gitleaks integrado como primer gate (shift-left de secrets)
#   - Trivy image scan con exit-code 1 (bloqueante)
#   - Trivy action pinada a versión específica @0.20.0
#   - Eliminado sleep fijo → retry loop con curl
#   - Maven cache (~/.m2) para todos los jobs que usan Java
#
# Nota DEMO BREAK 1:
#   Cuando un desarrollador renombra campos del DTO (telefono→phone, nombre→fullName)
#   Y también actualiza sus propios tests, este pipeline PASA (Job 1 verde).
#   La rotura de contrato se detecta en pipeline-integration.yml (contract tests).
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev, qa, preprod, prod]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
  pull_request:
    branches: [dev, qa, preprod, prod]
    paths:
      - 'microservice-b/**'
  workflow_dispatch:

concurrency:
  group: microservice-b-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: optaresolutions/mx-poc-paymentapp/microservice-b
  JAVA_VERSION: "21"
  MAVEN_VERSION: "3.9"
  TUH_JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 0 — Secret Scanning (Gitleaks)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  secret-scan:
    name: "0 — Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Detección de Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build & Quality (Shift-Left)
# Maven: mvn verify ejecuta compile + test + jacoco:report + jacoco:check
# sonar-project.properties con rutas Maven (target/) generado inline
# ──────────────────────────────────────────────────────────────────────────────
  build-quality:
    name: "1 — Build & Quality — Shift-Left [microservice-b]"
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Unit Tests + JaCoCo (mvn verify)
        working-directory: microservice-b
        run: |
          mvn verify \
            --no-transfer-progress \
            --batch-mode \
            -Dmaven.test.failure.ignore=false
        # mvn verify ejecuta en orden:
        #   jacoco:prepare-agent → compile → test → jacoco:report → jacoco:check (gate 80%)

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservice-b-test-results-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            microservice-b/target/surefire-reports/
            microservice-b/target/site/jacoco/
          retention-days: 14

      - name: Publicar resultados JUnit en PR
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: microservice-b/target/surefire-reports/*.xml

      # sonar-project.properties con rutas Maven (target/) — microservice-b
      - name: Generar sonar-project.properties (si no existe)
        working-directory: microservice-b
        run: |
          if [ ! -f sonar-project.properties ]; then
            echo "⚠️  sonar-project.properties no encontrado, generando valores por defecto..."
            cat > sonar-project.properties << 'EOF'
          sonar.organization=optaresolutions
          sonar.projectKey=OptareSolutions_mx-poc-paymentapp-microservice-b
          sonar.projectName=Telco Operator PaymentBox - Customer Profile (microservice-b)
          sonar.sources=src/main/java
          sonar.tests=src/test/java
          sonar.java.binaries=target/classes
          sonar.java.test.binaries=target/test-classes
          sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          sonar.junit.reportPaths=target/surefire-reports
          sonar.exclusions=**/model/**,**/config/**,**/CustomerProfileApplication.java
          EOF
            echo "✅ sonar-project.properties generado (rutas Maven)"
          else
            echo "✅ sonar-project.properties existente encontrado"
          fi

      - name: SonarCloud — Análisis de Calidad
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: microservice-b

      - name: Build JAR (artefacto)
        working-directory: microservice-b
        run: |
          mvn package -DskipTests \
            --no-transfer-progress \
            --batch-mode

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/target/*.jar
          retention-days: 1

      - name: Resumen de calidad
        if: always()
        run: |
          echo "## 🔍 Calidad — microservice-b" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (JUnit) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cobertura JaCoCo ≥80% | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarCloud Analysis | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | \`${{ env.JAVA_VERSION }}\` (temurin) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tool | Maven ${{ env.MAVEN_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Security Scan (Trivy FS + OWASP)
# OWASP via plugin Maven, Trivy versión pinada
# ──────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "2 — Seguridad — Trivy + OWASP [microservice-b]"
    runs-on: ubuntu-latest
    needs: build-quality
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/target/

      - name: "Trivy — Scan Filesystem (CRITICAL+HIGH → bloqueante)"
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: microservice-b
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload SARIF Trivy FS
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-microservice-b

      - name: "OWASP Dependency-Check — CVE en dependencias Java"
        working-directory: microservice-b
        run: |
          mvn org.owasp:dependency-check-maven:check \
            --no-transfer-progress \
            --batch-mode \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check || true
        continue-on-error: true  # Informativo en PoC, bloqueante en prod (quitar || true)

      - name: Subir reporte OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-microservice-b-${{ github.run_id }}
          path: microservice-b/target/dependency-check/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Image Ops (Build → Scan Imagen → Push GHCR)
# Trivy con exit-code 1 (bloqueante), versión pinada @0.20.0
# ──────────────────────────────────────────────────────────────────────────────
  image-ops:
    name: "3 — Image Ops — Build · Scan · Push [microservice-b]"
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      env-overlay: ${{ steps.env-info.outputs.overlay }}
      env-name: ${{ steps.env-info.outputs.name }}
      full-image: ${{ steps.image-tag.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/target/

      - name: Mapear rama → ambiente
        id: env-info
        run: |
          case "${{ github.ref_name }}" in
            dev)     echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (Desarrollo)"     >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
            qa)      echo "overlay=env-a" >> $GITHUB_OUTPUT ; echo "name=A (QA)"             >> $GITHUB_OUTPUT ; echo "prefix=env-a" >> $GITHUB_OUTPUT ;;
            preprod) echo "overlay=env-f" >> $GITHUB_OUTPUT ; echo "name=F (Pre-producción)" >> $GITHUB_OUTPUT ; echo "prefix=env-f" >> $GITHUB_OUTPUT ;;
            prod)    echo "overlay=prod"  >> $GITHUB_OUTPUT ; echo "name=Producción"          >> $GITHUB_OUTPUT ; echo "prefix=prod"  >> $GITHUB_OUTPUT ;;
            *)       echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (manual)"         >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
          esac

      - name: Calcular tag de imagen
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ steps.env-info.outputs.prefix }}-${SHORT_SHA}"
          FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "full_image=${FULL}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (local — para scan)
        uses: docker/build-push-action@v5
        with:
          context: microservice-b
          file: microservice-b/src/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy — Scan Imagen Docker (CRITICAL → bloqueante)"
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload SARIF Image Scan
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-microservice-b

      # ── Autenticación ECR (patrón producción ATT) ────────────────────────────
      # Activar cuando el PoC apunte a la Golden Image real del ECR de ATT.
      # - name: AWS OIDC Credentials — SOLO PRODUCCIÓN
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      #     aws-region: mx-central-1
      # - name: Login Amazon ECR — SOLO PRODUCCIÓN
      #   uses: aws-actions/amazon-ecr-login@v2
      # ─────────────────────────────────────────────────────────────────────────

      - name: Push → GHCR con tag ${{ steps.image-tag.outputs.tag }}
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: microservice-b
          file: microservice-b/src/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TUH_JAVA_OPTS=${{ env.TUH_JAVA_OPTS }}

      - name: Resumen de imagen
        run: |
          echo "## 🐳 Image — microservice-b" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | ${{ steps.env-info.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Image | \`eclipse-temurin:21-jre-alpine\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy CRITICAL | ✅ 0 encontrados |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4 — Smoke Test + GitOps Deploy
# Sin sleep fijo, health check loop, contrato validado, Maven para JDK
# ──────────────────────────────────────────────────────────────────────────────
  smoke-gitops:
    name: "4 — Smoke Test + GitOps Deploy [${{ needs.image-ops.outputs.env-name }}]"
    runs-on: ubuntu-latest
    needs: image-ops
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ needs.image-ops.outputs.image-tag }}
      OVERLAY:   ${{ needs.image-ops.outputs.env-overlay }}
      ENV_NAME:  ${{ needs.image-ops.outputs.env-name }}

    services:
      db-simulado:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: att_paymentbox
          POSTGRES_USER: att_user
          POSTGRES_PASSWORD: att_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U att_user -d att_paymentbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Aplicar schema TDM y seeders Billy
        env:
          PGPASSWORD: att_pass
        run: |
          sudo apt-get install -y postgresql-client -qq
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/01_schema.sql
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/02_billy_profiles.sql
          echo "✅ Schema y perfiles Billy aplicados"

      - name: Download JAR microservice-b
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/target/

      - name: Iniciar microservice-b
        run: |
          java -jar microservice-b/target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/att_paymentbox \
            --spring.datasource.username=att_user \
            --spring.datasource.password=att_pass \
            --server.port=8081 &

      - name: Health Check microservice-b
        run: |
          echo "⏳ Esperando microservice-b en :8081..."
          for i in {1..24}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health 2>/dev/null || echo "000")
            echo "  Intento $i/24: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "✅ microservice-b UP" && break
            [ "$i" = "24" ] && echo "❌ Timeout — microservice-b no respondió" && exit 1
            sleep 5
          done

      # Validación del contrato ACTUAL del microservice-b
      # NOTA: Los campos esperados deben coincidir con CustomerProfileDto
      - name: "Smoke Test — Validar contrato público (/api/customers/4544)"
        run: |
          RESP=$(curl -sf http://localhost:8081/api/customers/4544)
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          # Campos actuales del contrato (actualizar si cambia el DTO)
          expected_fields = ['telefono', 'nombre', 'status']
          missing = [f for f in expected_fields if f not in data]
          if missing:
              print(f'❌ FALLO DE CONTRATO: campos ausentes → {missing}')
              print(f'   Campos recibidos: {list(data.keys())}')
              print(f'   NOTA: Si el DTO fue renombrado, actualiza este smoke test')
              sys.exit(1)
          print(f'✅ Smoke test OK — contrato válido: {list(data.keys())}')
          "

      - name: "GitOps — Actualizar manifiesto: microservice-b → ${{ env.IMAGE_TAG }} en ${{ env.OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys
          overlay  = os.environ['OVERLAY']
          new_tag  = os.environ['IMAGE_TAG']
          filepath = f'k8s/overlays/{overlay}/kustomization.yaml'
          service  = 'microservice-b'
          registry = 'ghcr.io/optaresolutions/mx-poc-paymentapp'

          with open(filepath) as f:
              content = f.read()

          pattern     = rf'(- name: {re.escape(registry)}/{service}\n\s+newTag:)[^\n]*'
          replacement = rf'\1 "{new_tag}"'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              print(f'⚠️  Patrón no encontrado en {filepath}', file=sys.stderr)
              sys.exit(1)

          with open(filepath, 'w') as f:
              f.write(new_content)
          print(f'✅ {service}: {new_tag} → k8s/overlays/{overlay}/kustomization.yaml')
          EOF

      - name: "Git commit + push — manifiesto actualizado [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops(microservice-b): ${IMAGE_TAG} → ${ENV_NAME} [skip ci]"
          git push

      - name: "ArgoCD (simulado) — Sync ${{ env.ENV_NAME }}"
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "🚀 [ArgoCD] Cambio detectado en k8s/overlays/${OVERLAY}/"
          echo "📦 [ArgoCD] Application: att-paymentbox-${OVERLAY}"
          echo "🔧 [ArgoCD] Servicio:    microservice-b"
          echo "🏷️  [ArgoCD] Nueva imagen: ghcr.io/.../microservice-b:${IMAGE_TAG}"
          sleep 2
          echo "✅ [ArgoCD] Sync completado — microservice-b desplegado en ${ENV_NAME}"
          echo "──────────────────────────────────────────────────────"

      - name: Resumen del deploy
        run: |
          echo "## 🚀 Deploy — microservice-b" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | ${ENV_NAME} (\`${OVERLAY}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test Contrato | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| GitOps | ✅ |" >> $GITHUB_STEP_SUMMARY
