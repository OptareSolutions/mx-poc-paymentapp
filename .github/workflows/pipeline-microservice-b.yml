# [microservice-b] CI - Caller para reusable-microservice-pipeline.yml
# Equipo: Customer Profile (Team B) — lateral: Deliver siempre smoke+GitOps (`test_runner: smoke`).
# Ambientes: E->dev | A->qa | F->preprod | PRODUCCION->prod
name: "[microservice-b] CICD"
run-name: "${{ github.event_name == 'pull_request' && format('[microservice-b] CICD · #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || '[microservice-b] CICD' }}"

on:
  push:
    # Post-merge/pre integración sobre ramas con overlay explícito; feature/** ⇒ env por defecto `env-e` en reusable.
    branches: [feature/**, E, A, F, PRODUCCION]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  pull_request:
    # Ramos base (rama destino) del PR. Usual: HEAD = feature/** → BUILD validando merge hacia esa base,
    # sin Deliver hasta el push después del merge — ver reusable (event_name).
    branches: [E, A, F, PRODUCCION]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'
      - '.gitleaks.toml'
      - '.trivyignore'
  workflow_dispatch:

concurrency:
  group: microservice-b-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: CICD
    uses: ./.github/workflows/reusable-microservice-pipeline.yml
    with:
      microservice_name: microservice-b
      image_name: optaresolutions/mx-poc-paymentapp/microservice-b
      test_runner: smoke
    secrets: inherit
