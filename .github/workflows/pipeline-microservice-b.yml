name: "[microservice-b] CI — Build · Calidad · Seguridad · Deploy"

# ------------------------------------------------------------------------------
# Equipo: Customer Profile (Team B)
# Trigger: push en cualquier rama cuando cambia microservice-b/**
#
# Nota DEMO BREAK 1:
#   Cuando un desarrollador renombra los campos del DTO (telefono?phone, nombre?fullName)
#   Y también actualiza sus propios tests, este pipeline PASA (Job 1 verde).
#   La rotura de contrato se detecta en pipeline-integration.yml (contract tests).
#   Esto demuestra el valor de los tests de contrato declarativos.
# ------------------------------------------------------------------------------

on:
  push:
    branches: [develop, qa, uat, main]
    paths:
      - 'microservice-b/**'
      - '.github/workflows/pipeline-microservice-b.yml'
  workflow_dispatch:

concurrency:
  group: microservice-b-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/microservice-b

# ------------------------------------------------------------------------------
# JOB 1 — Build & Quality (Shift-Left)
# ------------------------------------------------------------------------------
jobs:
  build-quality:
    name: "1 · Build & Quality — Shift-Left [microservice-b]"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unit Tests + JaCoCo
        working-directory: microservice-b
        run: gradle test jacocoTestReport --no-daemon

      - name: Gate de Cobertura (= 80%)
        working-directory: microservice-b
        run: gradle jacocoTestCoverageVerification --no-daemon

      - name: Subir informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservice-b-test-results-${{ github.ref_name }}
          path: microservice-b/build/reports/

      - name: "SonarCloud — Análisis de Calidad de Código"
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: microservice-b

      - name: Build JAR (artefacto)
        working-directory: microservice-b
        run: gradle bootJar --no-daemon -x test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/build/libs/*.jar

# ------------------------------------------------------------------------------
# JOB 2 — Security Scan (Trivy Filesystem)
# ------------------------------------------------------------------------------
  security-scan:
    name: "2 · Seguridad — Trivy Scan [microservice-b]"
    runs-on: ubuntu-latest
    needs: build-quality
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/build/libs/

      - name: "Trivy — Scan Filesystem (JAR + dependencias)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: microservice-b
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload SARIF (Filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-microservice-b

# ------------------------------------------------------------------------------
# JOB 3 — Image Ops (Build ? Scan ? Push GHCR)
# ------------------------------------------------------------------------------
  image-ops:
    name: "3 · Image Ops — Build · Scan · Push [microservice-b]"
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      env-overlay: ${{ steps.env-info.outputs.overlay }}
      env-name: ${{ steps.env-info.outputs.name }}
      full-image: ${{ steps.image-tag.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/build/libs/

      - name: Mapear rama ? ambiente
        id: env-info
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (Desarrollo)" >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
            qa)      echo "overlay=env-a" >> $GITHUB_OUTPUT ; echo "name=A (QA)"              >> $GITHUB_OUTPUT ; echo "prefix=env-a" >> $GITHUB_OUTPUT ;;
            uat)     echo "overlay=env-u" >> $GITHUB_OUTPUT ; echo "name=U (UAT)"             >> $GITHUB_OUTPUT ; echo "prefix=env-u" >> $GITHUB_OUTPUT ;;
            main)    echo "overlay=prod"  >> $GITHUB_OUTPUT ; echo "name=Producción"            >> $GITHUB_OUTPUT ; echo "prefix=prod"  >> $GITHUB_OUTPUT ;;
            *)       echo "overlay=env-e" >> $GITHUB_OUTPUT ; echo "name=E (manual)"          >> $GITHUB_OUTPUT ; echo "prefix=env-e" >> $GITHUB_OUTPUT ;;
          esac

      - name: Calcular tag de imagen
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ steps.env-info.outputs.prefix }}-${SHORT_SHA}"
          FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "full_image=${FULL}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (local — para scan)
        uses: docker/build-push-action@v5
        with:
          context: microservice-b
          file: microservice-b/src/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy — Scan Imagen Docker (CRITICAL bloqueante)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload SARIF (Image Scan)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-microservice-b

      - name: Push ? GHCR con tag ${{ steps.image-tag.outputs.tag }}
        uses: docker/build-push-action@v5
        with:
          context: microservice-b
          file: microservice-b/src/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ------------------------------------------------------------------------------
# JOB 4 — Smoke Test + GitOps Deploy
# ------------------------------------------------------------------------------
  smoke-gitops:
    name: "4 · Smoke Test + GitOps Deploy [${{ needs.image-ops.outputs.env-name }}]"
    runs-on: ubuntu-latest
    needs: image-ops
    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ needs.image-ops.outputs.image-tag }}
      OVERLAY:   ${{ needs.image-ops.outputs.env-overlay }}
      ENV_NAME:  ${{ needs.image-ops.outputs.env-name }}

    services:
      db-simulado:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: att_paymentbox
          POSTGRES_USER: att_user
          POSTGRES_PASSWORD: att_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U att_user -d att_paymentbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Aplicar schema TDM y seeders Billy
        env:
          PGPASSWORD: att_pass
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/01_schema.sql
          psql -h localhost -U att_user -d att_paymentbox -f simulation/tdm-seeders/02_billy_profiles.sql

      - name: Download JAR microservice-b
        uses: actions/download-artifact@v4
        with:
          name: microservice-b-jar-${{ github.run_id }}
          path: microservice-b/build/libs/

      - name: Iniciar microservice-b (smoke test local)
        run: |
          java -jar microservice-b/build/libs/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/att_paymentbox \
            --spring.datasource.username=att_user \
            --spring.datasource.password=att_pass \
            --server.port=8081 &
          echo "? Esperando arranque de microservice-b..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            [ "$STATUS" -eq "200" ] && echo "? microservice-b UP" && break
            sleep 5
          done
          if [ "$STATUS" -ne "200" ]; then echo "? microservice-b no arrancó" && exit 1; fi

      - name: "Smoke Test — Verificar contrato público (/api/customers/4544)"
        run: |
          RESP=$(curl -sf http://localhost:8081/api/customers/4544)
          echo "Response: $RESP"
          python3 - << 'PYEOF'
          import json, sys
          data = json.loads(open('/dev/stdin').read()) if False else json.loads(''"$(curl -sf http://localhost:8081/api/customers/4544)"'')
          PYEOF
          # Verificar campos do contrato diretamente
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'telefono' in data, 'FAIL: campo telefono ausente (¿contrato roto?)'
          assert 'nombre'   in data, 'FAIL: campo nombre ausente (¿contrato roto?)'
          assert 'status'   in data, 'FAIL: campo status ausente'
          assert data['telefono'] == '4544', f'FAIL: telefono={data[\"telefono\"]}'
          print('? Smoke test OK - campos del contrato presentes')
          "

      - name: "GitOps — Actualizar manifiesto: microservice-b ? ${{ env.IMAGE_TAG }} en ${{ env.OVERLAY }}"
        run: |
          python3 - << 'EOF'
          import re, os, sys
          overlay  = os.environ['OVERLAY']
          new_tag  = os.environ['IMAGE_TAG']
          filepath = f'k8s/overlays/{overlay}/kustomization.yaml'
          service  = 'microservice-b'
          registry = 'ghcr.io/optaresolutions/mx-poc-paymentapp'

          with open(filepath) as f:
              content = f.read()

          pattern     = rf'(- name: {re.escape(registry)}/{service}\n\s+newTag:)[^\n]*'
          replacement = rf'\1 "{new_tag}"'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              print(f'??  Patrón no encontrado en {filepath}', file=sys.stderr)
              sys.exit(1)

          with open(filepath, 'w') as f:
              f.write(new_content)
          print(f'? {service}: {new_tag} ? k8s/overlays/{overlay}/kustomization.yaml')
          EOF

      - name: "Git commit + push — manifiesto actualizado [skip ci]"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.OVERLAY }}/kustomization.yaml
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "gitops(microservice-b): ${IMAGE_TAG} ? ${ENV_NAME} [skip ci]"
          git push

      - name: "ArgoCD (simulado) — Sync ${{ env.ENV_NAME }}"
        run: |
          echo "---------------------------------------------------------------"
          echo "?? [ArgoCD] Cambio detectado en k8s/overlays/${OVERLAY}/"
          echo "?? [ArgoCD] Application: att-paymentbox-${OVERLAY}"
          echo "?? [ArgoCD] Servicio:    microservice-b"
          echo "?? [ArgoCD] Nueva imagen: ghcr.io/.../microservice-b:${IMAGE_TAG}"
          echo "?? [ArgoCD] Entorno:     ${ENV_NAME}"
          sleep 2
          echo "? [ArgoCD] Sync completado — microservice-b desplegado en ${ENV_NAME}"
          echo "---------------------------------------------------------------"
