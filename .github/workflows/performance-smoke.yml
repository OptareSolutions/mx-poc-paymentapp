name: "[Performance] k6 Smoke Reusable — PaymentBox"

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base del servicio"
        required: false
        default: "http://localhost:8080"
      environment:
        description: "Entorno a testear"
        required: true
        type: choice
        options: [E, A, F, PRODUCCION]
        default: E
      vus:
        description: "Usuarios virtuales"
        required: false
        default: "20"
      duration:
        description: "Duracion del test (5m a 10m)"
        required: false
        default: "7m"
      update_baseline:
        description: "Actualizar baseline si los gates pasan"
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "0 2 * * *"

  workflow_call:
    inputs:
      base_url:
        type: string
        required: false
        default: "http://localhost:8080"
      environment:
        type: string
        required: false
        default: "ci"
      vus:
        type: string
        required: false
        default: "20"
      duration:
        type: string
        required: false
        default: "7m"
      update_baseline:
        type: boolean
        required: false
        default: false
    outputs:
      performance_passed:
        description: "true si k6 y la comparacion contra baseline aprobaron"
        value: ${{ jobs.k6-performance.outputs.passed }}

concurrency:
  group: performance-smoke-${{ inputs.environment || github.event.inputs.environment || github.ref_name || 'ci' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  k6-performance:
    name: "Smoke Performance — k6 (20 VUs / 7 min)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}

    env:
      BASE_URL: ${{ inputs.base_url || github.event.inputs.base_url || 'http://localhost:8080' }}
      ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || github.ref_name || 'ci' }}
      K6_VUS: ${{ inputs.vus || github.event.inputs.vus || '20' }}
      K6_DURATION: ${{ inputs.duration || github.event.inputs.duration || '7m' }}
      RESULTS_DIR: tests/k6/results

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Iniciar entorno de simulacion
        working-directory: simulation
        timeout-minutes: 8
        run: docker compose up -d --build --wait

      - name: Verificar health de microservice-a
        run: |
          curl --retry 12 --retry-delay 5 --retry-connrefused -sf \
            "${BASE_URL}/actuator/health" | grep -q '"status":"UP"' \
            && echo "microservice-a healthy" \
            || (echo "microservice-a no responde"; exit 1)

      - name: Instalar k6
        run: |
          K6_VERSION="v0.55.0"
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
              "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version

      - name: Configurar Node.js para comparacion
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Descargar baseline anterior
        id: baseline
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          BASELINE_NAME: k6-performance-baseline-${{ env.ENVIRONMENT }}
          RESULTS_DIR: ${{ env.RESULTS_DIR }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const artifactName = process.env.BASELINE_NAME;
            const resultsDir = process.env.RESULTS_DIR;
            const { owner, repo } = context.repo;
            fs.mkdirSync(resultsDir, { recursive: true });

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const baseline = artifacts
              .filter((a) => a.name === artifactName && !a.expired)
              .filter((a) => !a.workflow_run || a.workflow_run.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (!baseline) {
              core.info(`Sin baseline previo (${artifactName})`);
              core.setOutput('exists', 'false');
              return;
            }

            const zip = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: baseline.id,
              archive_format: 'zip',
            });

            const zipPath = path.join(resultsDir, 'baseline.zip');
            fs.writeFileSync(zipPath, Buffer.from(zip.data));
            execFileSync('unzip', ['-qo', zipPath, '-d', resultsDir]);

            const downloaded = path.join(resultsDir, 'baseline.json');
            if (!fs.existsSync(downloaded)) {
              const latest = path.join(resultsDir, 'smoke_performance_latest.json');
              if (fs.existsSync(latest)) fs.renameSync(latest, downloaded);
            }

            core.info(`Baseline descargado: ${artifactName} (${baseline.created_at})`);
            core.setOutput('exists', fs.existsSync(downloaded) ? 'true' : 'false');

      - name: Ejecutar k6 Smoke Performance
        id: k6-run
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "${RESULTS_DIR}"
          echo "k6 smoke: ${K6_VUS} VUs / ${K6_DURATION} / ${BASE_URL}"
          k6 run \
            --env BASE_URL="${BASE_URL}" \
            --env ENVIRONMENT="${ENVIRONMENT}" \
            --env GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --env K6_VUS="${K6_VUS}" \
            --env K6_DURATION="${K6_DURATION}" \
            --out json="${RESULTS_DIR}/k6_raw_${GITHUB_RUN_ID}.json" \
            tests/k6/smoke_performance.js

      - name: Comparar con baseline historico
        id: compare
        if: always()
        run: |
          if [ -f "${RESULTS_DIR}/smoke_performance_latest.json" ] && [ -f "${RESULTS_DIR}/baseline.json" ]; then
            node tests/k6/scripts/compare-results.js \
              --current  "${RESULTS_DIR}/smoke_performance_latest.json" \
              --baseline "${RESULTS_DIR}/baseline.json" \
              --output   "${RESULTS_DIR}/comparison_report.md"
            echo "compare_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin baseline previo para comparar; se publica solo el resultado actual."
            echo "compare_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluar quality gates
        id: evaluate
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          result_path = os.path.join(os.environ['RESULTS_DIR'], 'smoke_performance_latest.json')
          checks = [
              ('flujo_completo_p95_ms', 3000, 'Flujo completo p95 < 3000ms'),
              ('login_p95_ms', 700, 'Login p95 < 700ms'),
              ('consulta_p95_ms', 900, 'Consulta p95 < 900ms'),
              ('pago_p95_ms', 1200, 'Actualizacion/pago p95 < 1200ms'),
              ('error_rate', 0.01, 'Error rate < 1%'),
          ]

          errors = []
          if not os.path.exists(result_path):
              errors.append('No se genero smoke_performance_latest.json')
              metrics = {}
          else:
              with open(result_path, encoding='utf-8') as f:
                  metrics = json.load(f).get('metrics', {})

          for key, limit, desc in checks:
              val = metrics.get(key)
              if val is None:
                  errors.append(f'{desc}: sin datos')
              elif val > limit:
                  errors.append(f'{desc}: {val:.2f} > {limit}')
              else:
                  print(f'OK: {desc}: {val:.2f}')

          compare_passed = os.environ.get('COMPARE_PASSED', 'false') == 'true'
          if not compare_passed:
              errors.append('Comparacion contra baseline fallo')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"passed={'false' if errors else 'true'}\n")

          if errors:
              print('\n'.join(f'FAIL: {e}' for e in errors))
              raise SystemExit(1)
          PY
        env:
          COMPARE_PASSED: ${{ steps.compare.outputs.compare_passed }}

      - name: Publicar resumen
        if: always()
        run: |
          {
            echo "## k6 Smoke Performance — PaymentBox"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Entorno | \`${ENVIRONMENT}\` |"
            echo "| VUs | ${K6_VUS} |"
            echo "| Duracion | ${K6_DURATION} |"
            echo "| Baseline | ${{ steps.baseline.outputs.exists == 'true' && 'descargado' || 'no disponible' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "${RESULTS_DIR}/comparison_report.md" ]; then
            cat "${RESULTS_DIR}/comparison_report.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "${RESULTS_DIR}/smoke_performance_latest.json" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open(os.path.join(os.environ['RESULTS_DIR'], 'smoke_performance_latest.json'), encoding='utf-8') as f:
              m = json.load(f).get('metrics', {})
          rows = [
              ('Flujo completo p95', m.get('flujo_completo_p95_ms'), '3000 ms'),
              ('Login p95', m.get('login_p95_ms'), '700 ms'),
              ('Consulta p95', m.get('consulta_p95_ms'), '900 ms'),
              ('Actualizacion/pago p95', m.get('pago_p95_ms'), '1200 ms'),
              ('Error rate', (m.get('error_rate') or 0) * 100, '1 %'),
          ]
          print('| Metrica | Resultado | Limite |')
          print('|---------|-----------|--------|')
          for name, value, limit in rows:
              suffix = '%' if name == 'Error rate' else 'ms'
              text = 'N/A' if value is None else f'{value:.2f} {suffix}'
              print(f'| {name} | {text} | {limit} |')
          PY
          fi

      - name: Preparar baseline actualizado
        if: |
          steps.evaluate.outputs.passed == 'true' &&
          (
            (github.event_name == 'push' && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name)) ||
            (github.event_name == 'schedule' && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name)) ||
            ((inputs.update_baseline || github.event.inputs.update_baseline == 'true') && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name))
          )
        run: |
          cp "${RESULTS_DIR}/smoke_performance_latest.json" "${RESULTS_DIR}/baseline.json"

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-performance-results-${{ github.run_id }}
          path: tests/k6/results/
          retention-days: 90
          if-no-files-found: warn

      - name: Subir baseline actualizado
        if: |
          steps.evaluate.outputs.passed == 'true' &&
          hashFiles('tests/k6/results/baseline.json') != '' &&
          (
            (github.event_name == 'push' && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name)) ||
            (github.event_name == 'schedule' && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name)) ||
            ((inputs.update_baseline || github.event.inputs.update_baseline == 'true') && contains(fromJSON('["E","A","F","PRODUCCION"]'), github.ref_name))
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-performance-baseline-${{ env.ENVIRONMENT }}
          path: tests/k6/results/baseline.json
          retention-days: 365
          overwrite: true

      - name: Detener entorno
        if: always()
        working-directory: simulation
        run: docker compose down -v --remove-orphans
