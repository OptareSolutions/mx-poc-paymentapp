name: Testing Factory — CI Quality Gates (feature/* · PR→E)

# ──────────────────────────────────────────────────────────────────────────────
# PIPELINE: Testing Factory — AT&T PaymentBox PoC
#
# PROPÓSITO:
#   Suite ligera de CI para ramas feature/* y Pull Requests hacia E (Desarrollo).
#   Valida calidad antes de integrar al entorno compartido.
#
# SUITES INCLUIDAS:
#   1. API Tests      — Karate: @smoke, @e2e, @contract + oasdiff (OpenAPI)
#   2. Performance    — k6: 20 VUs / 7 min contra entorno de simulación
#   3. Salesforce RPA — Node.js + Playwright: flujo completo JWT (10 pasos)
#
# ACTIVACIÓN:
#   push → feature/**          (CI en ramas de desarrollo)
#   pull_request → E           (validación antes de integrar a Desarrollo)
#   workflow_dispatch          (ejecución manual)
#   También disparan cambios en pipeline-microservice-* / reusable-microservice-pipeline (paths)
#   y en ui-paymentbox/** (front Angular).
#
# NOTA: Para PRs hacia A y F, usar golden-pipeline-testing.yml (suite completa).
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'microservice-a/**'
      - 'microservice-b/**'
      - 'ui-paymentbox/**'
      - 'tests/**'
      - 'simulation/**'
      - 'doc/02_CI_CD/rpa/**'
      - '.github/workflows/rpa.yml'
      - '.github/workflows/testing-factory.yml'
      - '.github/workflows/reusable-api-testing.yml'
      - '.github/workflows/performance-smoke.yml'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'

  pull_request:
    branches:
      - E
    paths:
      - 'microservice-a/**'
      - 'microservice-b/**'
      - 'ui-paymentbox/**'
      - 'tests/**'
      - 'simulation/**'
      - 'doc/02_CI_CD/rpa/**'
      - '.github/workflows/rpa.yml'
      - '.github/workflows/testing-factory.yml'
      - '.github/workflows/reusable-api-testing.yml'
      - '.github/workflows/performance-smoke.yml'
      - '.github/workflows/pipeline-microservice-a.yml'
      - '.github/workflows/pipeline-microservice-b.yml'
      - '.github/workflows/reusable-microservice-pipeline.yml'

  workflow_dispatch:
    inputs:
      product_name:
        description: 'Nombre del producto para la Oportunidad Salesforce'
        required: false
        default: 'Paquete Básico'
      product_price:
        description: 'Precio unitario del producto'
        required: false
        default: '1500'

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  packages: read

# Usar SHA del HEAD del PR cuando existe (pull_request/synchronize); si no, SHA del push/dispatch.
# Así push + PR sobre el mismo commit comparten grupo y cancel-in-progress evita dos corridas gemelas.
concurrency:
  group: testing-factory-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  JAVA_DIST:    "temurin"
  BASE_URL:     "http://localhost:8080"
  MSVC_B_URL:   "http://localhost:18081"

# ══════════════════════════════════════════════════════════════════════════════
jobs:

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  JOB 0 · Change Scope                                                   ║
# ║  Separa cambios de app/tests vs RPA para no ejecutar gates pesados       ║
# ║  cuando solo se toca la orquestación RPA.                                ║
# ╚══════════════════════════════════════════════════════════════════════════╝
  change-scope:
    name: Change Scope — Testing Factory
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.scope.outputs.app_changed }}
      rpa_changed: ${{ steps.scope.outputs.rpa_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            APP_CHANGED="true"
            RPA_CHANGED="true"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              RANGE="$PR_BASE_SHA...$PR_HEAD_SHA"
            elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              RANGE="$BASE_SHA...$HEAD_SHA"
            else
              RANGE="HEAD~1...HEAD"
            fi

            CHANGED_FILES="$(git diff --name-only "$RANGE" || true)"

            APP_CHANGED="false"
            RPA_CHANGED="false"

            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(microservice-a/|microservice-b/|ui-paymentbox/|tests/|simulation/|\.github/workflows/reusable-api-testing\.yml|\.github/workflows/testing-factory\.yml|\.github/workflows/pipeline-microservice-a\.yml|\.github/workflows/pipeline-microservice-b\.yml|\.github/workflows/reusable-microservice-pipeline\.yml)'; then
              APP_CHANGED="true"
            fi

            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(doc/02_CI_CD/rpa/|\.github/workflows/rpa\.yml|\.github/workflows/testing-factory\.yml)'; then
              RPA_CHANGED="true"
            fi
          fi

          {
            echo "app_changed=$APP_CHANGED"
            echo "rpa_changed=$RPA_CHANGED"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Testing Factory Change Scope"
            echo ""
            echo "| Area | Changed |"
            echo "|------|---------|"
            echo "| App/API/Performance | $APP_CHANGED |"
            echo "| RPA/orchestration | $RPA_CHANGED |"
          } >> "$GITHUB_STEP_SUMMARY"

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  JOB 1 · API Tests — reusable (Karate + oasdiff)                        ║
# ╚══════════════════════════════════════════════════════════════════════════╝
  api-tests:
    name: API Tests — reusable quality gate
    needs: change-scope
    if: needs.change-scope.outputs.app_changed == 'true'
    uses: ./.github/workflows/reusable-api-testing.yml
    with:
      karate_env: ci
      base_ref: ${{ github.base_ref || 'E' }}
      artifact_suffix: testing-factory-${{ github.run_number }}
    secrets: inherit


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  JOB 2 · Smoke Performance (k6 — 20 VUs / 7 min)                       ║
# ║  Validación de thresholds de latencia contra entorno de simulación      ║
# ╚══════════════════════════════════════════════════════════════════════════╝
  performance-smoke:
    name: Smoke Performance — k6 (20 VUs / 7 min)
    needs: [change-scope, api-tests]
    if: needs.change-scope.outputs.app_changed == 'true' && needs.api-tests.result == 'success'
    uses: ./.github/workflows/performance-smoke.yml
    with:
      base_url: http://localhost:8080
      environment: ci
      vus: "20"
      duration: "7m"
      update_baseline: false
    secrets: inherit


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  JOB 3a · RPA Decision                                                  ║
# ║  Evita duplicar RPA en cada push: solo corre por cambio RPA o variable. ║
# ╚══════════════════════════════════════════════════════════════════════════╝
  rpa-decision:
    name: RPA Decision — Feature Quality Gate
    runs-on: ubuntu-latest
    needs: [change-scope, performance-smoke]
    if: always()
    outputs:
      run_rpa: ${{ steps.decision.outputs.run_rpa }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Decide RPA scope
        id: decision
        env:
          RPA_ENABLED: ${{ vars.RPA_ENABLED }}
          RPA_CHANGED: ${{ needs.change-scope.outputs.rpa_changed }}
        run: |
          RUN_RPA="false"
          REASON="Informative RPA skipped: no RPA-critical path changed and RPA_ENABLED is not true"

          if [ "$RPA_ENABLED" = "true" ]; then
            RUN_RPA="true"
            REASON="Informative RPA requested by repository variable RPA_ENABLED=true"
          elif [ "$RPA_CHANGED" = "true" ]; then
            RUN_RPA="true"
            REASON="Informative RPA requested because RPA-critical files changed"
          fi

          {
            echo "run_rpa=$RUN_RPA"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## RPA Decision"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| RPA enabled variable | ${RPA_ENABLED:-false} |"
            echo "| RPA-critical path changed | $RPA_CHANGED |"
            echo "| Decision | $RUN_RPA |"
            echo "| Policy | informative |"
            echo "| Reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  JOB 3b · Salesforce RPA (Reusable)                                     ║
# ║  Única implementación: .github/workflows/rpa.yml                        ║
# ╚══════════════════════════════════════════════════════════════════════════╝
  salesforce-rpa:
    name: Salesforce RPA — Reusable Informative Gate
    needs: rpa-decision
    if: always()
    uses: ./.github/workflows/rpa.yml
    secrets: inherit
    with:
      run_rpa: ${{ needs.rpa-decision.outputs.run_rpa == 'true' }}
      enforce_gate: false
      reason: ${{ needs.rpa-decision.outputs.reason }}
      product_name: ${{ github.event.inputs.product_name || 'Paquete Básico' }}
      product_price: ${{ github.event.inputs.product_price || '1500' }}
