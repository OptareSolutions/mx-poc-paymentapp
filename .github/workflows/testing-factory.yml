name: Testing Factory – CI/CD Quality Gates

on:
  push:
    branches-ignore:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      product_name:
        description: 'Product name to add to the Opportunity'
        required: false
        default: 'Paquete Básico'
      product_price:
        description: 'Unit price for the product'
        required: false
        default: '1500'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: testing-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Functional, Integration and Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Placeholder API tests
        run: |
          mkdir -p reports/api
          echo '{"status":"PASSED","type":"api-functional"}' > reports/api/functional.json
          echo '{"status":"PASSED","type":"api-integration"}' > reports/api/integration.json
          echo '{"status":"PASSED","type":"contract-testing","breakingChanges":0}' > reports/api/contract.json

      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/api/
          retention-days: 30

  performance-smoke:
    name: Smoke Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create demo k6 script
        run: |
          mkdir -p tests/performance reports/performance
          cat > tests/performance/smoke.k6.js <<'EOF'
          import http from 'k6/http';
          import { sleep, check } from 'k6';
          import { Rate } from 'k6/metrics';

          export const errorRate = new Rate('errors');

          export const options = {
            vus: 20,
            duration: '5m',
            thresholds: {
              http_req_failed: ['rate<0.01'],
              http_req_duration: ['p(95)<3000']
            }
          };

          export default function () {
            const res = http.get('https://test.k6.io');
            const ok = check(res, {
              'status is 200': (r) => r.status === 200,
              'p95 target candidate': (r) => r.timings.duration < 3000
            });

            errorRate.add(!ok);
            sleep(Math.random() * 2 + 1);
          }
          EOF

      - name: Run k6 smoke performance
        run: |
          k6 run \
            --summary-export reports/performance/k6-summary.json \
            tests/performance/smoke.k6.js

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-reports
          path: reports/performance/
          retention-days: 30

  salesforce-rpa:
    name: Salesforce RPA/API Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: performance-smoke

    env:
      RPA_PRODUCT_NAME: ${{ github.event.inputs.product_name || 'Paquete Básico' }}
      RPA_PRODUCT_PRICE: ${{ github.event.inputs.product_price || '1500' }}

      SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
      SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
      SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Create Salesforce JWT key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_KEY }}" > server.key
          chmod 600 server.key

      - name: Authenticate to Salesforce with JWT
        run: |
          sf org login jwt \
            --client-id "$SALESFORCE_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SALESFORCE_USERNAME" \
            --instance-url "$SALESFORCE_INSTANCE_URL" \
            --alias rpa-org

      - name: Export Salesforce session
        run: |
          sf org display --target-org rpa-org --json > sf-auth.json

      - name: Install RPA dependencies
        working-directory: doc/02_CI_CD/rpa
        run: npm ci

      - name: Run Salesforce RPA/API flow
        working-directory: doc/02_CI_CD/rpa
        run: node scripts/rpa-flow.js

      - name: Upload RPA evidences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-rpa-evidences
          path: |
            doc/02_CI_CD/rpa/results/
            sf-auth.json
          retention-days: 30
