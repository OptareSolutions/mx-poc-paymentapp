name: "🔒 Pipeline Seguridad — Repo-wide · Gitleaks · CodeQL · Dependabot"

# ──────────────────────────────────────────────────────────────────────────────
# Pipeline transversal de seguridad — NUEVO en v2
# Basado en patrones de mxapm0002577-source-identity-connector
#
# Cubre todo el repositorio independientemente del componente que cambió.
# Complementa los scans de Trivy que van en cada pipeline de componente.
#
# Jobs:
#   1 — Gitleaks: detección de secrets/tokens en todo el repo
#   2 — CodeQL: análisis semántico de seguridad (Java + TypeScript)
#   3 — Dependency Review: revisión de cambios en dependencias en PRs
#   4 — Resumen de seguridad
#
# Triggers:
#   - Push a ramas protegidas
#   - Pull Requests (para detectar secretos introducidos en PRs)
#   - Schedule semanal (lunes 07:00 UTC) — para nuevas CVEs en deps existentes
#   - workflow_dispatch (manual)
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [prod, dev, qa, preprod]
  pull_request:
    branches: [prod, dev, qa, preprod]
  schedule:
    - cron: '0 7 * * 1'  # Lunes 07:00 UTC — scan programado semanal
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Gitleaks: Detección de Secrets en todo el repo
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  gitleaks:
    name: "1 — Gitleaks — Detección de Secrets (repo-wide)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Escanea todo el historial git, no solo el último commit

      - name: Gitleaks — Scan completo del repositorio
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Verificar archivo .gitignore protege .env
        run: |
          echo "🔍 Verificando que archivos sensibles están en .gitignore..."
          MISSING=()
          for pattern in ".env" "*.key" "*.pem" "*.p12" "*.jks" "application-prod.yml" "application-prod.yaml"; do
            if ! grep -qF "$pattern" .gitignore 2>/dev/null; then
              MISSING+=("$pattern")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️  Los siguientes patrones NO están en .gitignore:"
            printf '   - %s\n' "${MISSING[@]}"
            echo ""
            echo "Considera añadirlos para evitar commits accidentales de credenciales."
            # No bloquear, solo advertir
          else
            echo "✅ Patrones sensibles protegidos en .gitignore"
          fi

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2a — CodeQL: Análisis semántico Java (microservice-a + microservice-b)
# ──────────────────────────────────────────────────────────────────────────────
  codeql-java:
    name: "2a — CodeQL — Análisis Semántico Java"
    runs-on: ubuntu-latest
    # Solo en push/PR a ramas protegidas y en schedule
    if: github.event_name != 'workflow_dispatch' || true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Inicializar CodeQL (Java)
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build microservice-a para CodeQL
        working-directory: microservice-a
        run: gradle classes --no-daemon -x test
        continue-on-error: true

      - name: Build microservice-b para CodeQL
        working-directory: microservice-b
        run: gradle classes --no-daemon -x test
        continue-on-error: true

      - name: Ejecutar análisis CodeQL Java
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-java
          upload: true

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2b — CodeQL: Análisis semántico TypeScript (ui-paymentbox)
# ──────────────────────────────────────────────────────────────────────────────
  codeql-typescript:
    name: "2b — CodeQL — Análisis Semántico TypeScript"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inicializar CodeQL (TypeScript/JavaScript)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-paymentbox/package-lock.json

      - name: npm ci (para análisis)
        working-directory: ui-paymentbox
        run: npm ci --prefer-offline
        continue-on-error: true

      - name: Ejecutar análisis CodeQL TypeScript
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-typescript
          upload: true

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Dependency Review (solo en PRs)
# Detecta vulnerabilidades introducidas por cambios en dependencias
# ──────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: "3 — Dependency Review (PRs)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review — Detectar CVEs nuevas en el PR
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-3.0  # Licencias incompatibles con uso comercial
          comment-summary-in-pr: always

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4 — Resumen consolidado de seguridad
# ──────────────────────────────────────────────────────────────────────────────
  security-summary:
    name: "4 — Resumen de Seguridad"
    runs-on: ubuntu-latest
    needs: [gitleaks, codeql-java, codeql-typescript]
    if: always()

    steps:
      - name: Generar resumen de seguridad
        run: |
          echo "## 🔒 Resumen de Seguridad — Repo-wide" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          GITLEAKS_STATUS="${{ needs.gitleaks.result }}"
          CODEQL_JAVA_STATUS="${{ needs.codeql-java.result }}"
          CODEQL_TS_STATUS="${{ needs.codeql-typescript.result }}"

          [ "$GITLEAKS_STATUS" = "success" ] && GITLEAKS_ICON="✅" || GITLEAKS_ICON="❌"
          [ "$CODEQL_JAVA_STATUS" = "success" ] && JAVA_ICON="✅" || JAVA_ICON="⚠️"
          [ "$CODEQL_TS_STATUS" = "success" ] && TS_ICON="✅" || TS_ICON="⚠️"

          echo "| Gitleaks (secrets) | ${GITLEAKS_ICON} ${GITLEAKS_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Java | ${JAVA_ICON} ${CODEQL_JAVA_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL TypeScript | ${TS_ICON} ${CODEQL_TS_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Los resultados detallados están disponibles en la pestaña **Security** del repositorio." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | Rama | Actor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ github.event_name }}\` | \`${{ github.ref_name }}\` | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
