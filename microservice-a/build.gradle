// ─────────────────────────────────────────────────────────────────────────────
// DEPRECATED — Reemplazado por pom.xml (Maven)
// Migración: Java 17 → 21 · Spring Boot 3.2.5 → 3.5.3 · Gradle → Maven
// Este archivo ya NO es utilizado por el pipeline (pipeline-microservice-a.yml).
// Conservado como referencia histórica. Usar pom.xml para todos los builds.
// ─────────────────────────────────────────────────────────────────────────────
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'com.att.paymentbox'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'com.h2database:h2'
}

jacoco {
    toolVersion = '0.8.11'
}

def jacocoExclusions = [
    // Clases de infraestructura sin lógica de negocio
    '**/model/**',
    '**/dto/**',
    '**/config/**',
    '**/client/**',
    '**/PaymentBoxApplication.class',
    // Clases generadas por Spring / JPA
    '**/*$*',
]

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExclusions)
    }))
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExclusions)
    }))
    violationRules {
        rule {
            limit {
                minimum = 0.80 // Gate de cobertura 80% sobre código de negocio
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}
