# GitHub Actions Workflow — RPA Flujo Ventas Salesforce (AT&T Demo)
# ─────────────────────────────────────────────────────────────────────────────
# Ejecuta el script RPA de Salesforce en modo headless.
# Secrets necesarios: SF_URL, SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN
#
# NOTA: NO hacer push/merge directo a main.
# ─────────────────────────────────────────────────────────────────────────────
name: RPA - Salesforce Sales Flow

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Ejecutar en modo headless'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    # Ejecutar de lunes a viernes a las 08:00 UTC (antes del horario de demo)
    - cron: '0 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: rpa-salesforce-${{ github.ref }}
  cancel-in-progress: false   # No cancelar ejecuciones en curso (demo en vivo)

jobs:
  rpa-salesforce:
    name: RPA — Flujo Ventas Salesforce
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SF_URL: ${{ secrets.SF_URL }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      RPA_HEADLESS: ${{ inputs.headless || 'true' }}
      SCREENSHOT_DIR: ./evidencias

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        working-directory: scripts
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create evidencias directory
        run: mkdir -p evidencias

      - name: Run Salesforce RPA Flow
        working-directory: scripts
        run: python salesforce_flow.py --headless
        env:
          ID_DOCUMENT_PATH: ../evidencias/id_documento_demo.jpg

      - name: Upload evidencias (screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpa-evidencias-${{ github.run_number }}
          path: evidencias/
          retention-days: 30
          if-no-files-found: warn
