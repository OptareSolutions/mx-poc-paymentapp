name: RPA – Web Automation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'rpa/**'
      - '.github/workflows/rpa.yml'
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Record ID to query'
        required: false
        default: '1'

# Least-privilege permissions
permissions:
  contents: read

# Cancel outdated runs on the same branch (keeps runners free)
concurrency:
  group: rpa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpa:
    name: Run RPA Flow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RPA_BASE_URL:  ${{ secrets.RPA_BASE_URL }}
      RPA_USERNAME:  ${{ secrets.RPA_USERNAME }}
      RPA_PASSWORD:  ${{ secrets.RPA_PASSWORD }}
      RPA_RECORD_ID: ${{ github.event.inputs.record_id || '1' }}
      RPA_TIMEOUT_MS: '30000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rpa/package-lock.json

      - name: Install dependencies
        working-directory: rpa
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: rpa
        run: npx playwright install chromium --with-deps

      - name: Run RPA flow
        working-directory: rpa
        run: node scripts/rpa-flow.js

      - name: Upload results & screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpa-results-${{ github.run_number }}
          path: rpa/results/
          retention-days: 30
          if-no-files-found: warn
