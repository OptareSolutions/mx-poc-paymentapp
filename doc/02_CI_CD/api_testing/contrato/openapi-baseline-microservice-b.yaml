openapi: 3.0.1
info:
  title: Customer Profile API
  description: >-
    Microservice B — Perfiles de clientes Telco Operator.
    CONTRATO PÚBLICO estable — cualquier cambio incompatible bloqueará el pipeline.
  version: 1.0.0
  contact:
    name: Team B — Customer Profile
servers:
  - url: http://localhost:8081
    description: Desarrollo local
tags:
  - name: Customer Profile
    description: Microservice B — Perfiles de clientes Telco Operator

paths:
  /api/customers/{telefono}:
    get:
      tags:
        - Customer Profile
      summary: Obtener perfil de cliente por teléfono
      operationId: getByTelefono
      parameters:
        - name: telefono
          in: path
          required: true
          description: Número de teléfono del cliente
          schema:
            type: string
      responses:
        '200':
          description: Perfil del cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileDto'
              example:
                id: 1
                telefono: "5512345678"
                nombre: "Juan Pérez"
                status: "ACTIVO"
        '404':
          description: Cliente no encontrado
        '500':
          description: Error interno del servidor

  /actuator/health:
    get:
      tags:
        - Actuator
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service UP

components:
  schemas:
    CustomerProfileDto:
      type: object
      description: >-
        DTO de contrato público del perfil de cliente.
        CAMPOS CRÍTICOS: telefono y nombre — no renombrar sin versionar la API.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del cliente
        telefono:
          type: string
          description: "Número de teléfono del cliente (CAMPO DE CONTRATO — no renombrar)"
        nombre:
          type: string
          description: "Nombre completo del cliente (CAMPO DE CONTRATO — no renombrar)"
        status:
          type: string
          description: Estado del cliente
          enum: [ACTIVO, INACTIVO, SUSPENDIDO]
