name: "AT&T PoC QA — Pipeline CI/CD Orquestador"

# ──────────────────────────────────────────────────────────────────────────────
# DESCRIPCIÓN
#   Pipeline principal de QA para la PoC AT&T PaymentBox.
#   Orquesta cuatro suites de prueba en paralelo y aplica un Quality Gate
#   consolidado antes de marcar el pipeline como exitoso o fallido.
#
# JOBS (paralelos):
#   1. api-testing   → Karate (funcional + contrato + integración)
#   2. performance   → k6 (smoke test de ruta crítica)
#   3. ui-testing    → Selenium WebDriver (UI E2E)  [condicional: UI_TESTS_ENABLED]
#   4. rpa           → Python / Playwright (Salesforce automation) [condicional: RPA_ENABLED]
#   5. quality-gate  → Gate consolidado (depende de 1-4)
#
# ACTIVACIÓN:
#   - Push en cualquier rama excepto main
#   - Pull Request hacia cualquier rama excepto main
#
# VARIABLES DE REPOSITORIO REQUERIDAS:
#   RPA_ENABLED      = true  (para activar el job RPA)
#   UI_TESTS_ENABLED = true  (para activar el job UI con Selenium)
#
# SECRETS REQUERIDOS (para job RPA):
#   SF_URL, SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches-ignore: [main]

# ── Permisos mínimos necesarios (least privilege) ─────────────────────────────
permissions:
  contents: read
  checks: write        # publicar resultados de tests en GitHub UI
  pull-requests: write # comentarios en PRs con resumen de resultados

# ── Control de concurrencia ───────────────────────────────────────────────────
# Cancela builds obsoletos en PRs; preserva deploys en ramas de ambiente
concurrency:
  group: att-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Variables globales ────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  JAVA_VERSION: "17"
  JAVA_DIST: "temurin"
  BASE_URL: "http://localhost:8080"

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 · API TESTING (Karate – funcional + contrato + integración)
  # ════════════════════════════════════════════════════════════════════════════
  api-testing:
    name: "1 · API Testing (Karate)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login en GHCR (imágenes de simulación)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Iniciar entorno de simulación (Docker Compose)
        working-directory: simulation
        timeout-minutes: 8
        run: |
          docker compose up -d --build --wait
          echo "✅ Entorno de simulación iniciado"
          echo "   Microservice-A : http://localhost:8080"
          echo "   Microservice-B : http://localhost:18081"
          echo "   Mock Operador  : http://localhost:4010"
          echo "   Mock Recibo    : http://localhost:4011"

      - name: Verificar health de servicios
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused -sf \
            http://localhost:8080/actuator/health | grep -q '"status":"UP"' \
            && echo "✅ microservice-a healthy" \
            || (echo "❌ microservice-a no responde"; exit 1)

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: maven

      - name: Ejecutar tests Karate (funcional + contrato + integración)
        working-directory: tests/functional-karate
        env:
          BASE_URL: ${{ env.BASE_URL }}
          KARATE_ENV: ci
        run: |
          mvn test \
            -Dkarate.env=ci \
            -DbaseUrl=${{ env.BASE_URL }} \
            -q --no-transfer-progress

      - name: Publicar resultados Karate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-testing-results-${{ github.run_number }}
          path: |
            tests/functional-karate/target/karate-reports/
            tests/functional-karate/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Detener entorno de simulación
        if: always()
        working-directory: simulation
        run: docker compose down -v --remove-orphans


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 · PERFORMANCE TESTING (k6 – smoke test de ruta crítica)
  # ════════════════════════════════════════════════════════════════════════════
  performance:
    name: "2 · Performance Testing (k6)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login en GHCR (imágenes de simulación)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Iniciar entorno de simulación (Docker Compose)
        working-directory: simulation
        timeout-minutes: 8
        run: |
          docker compose up -d --build --wait
          echo "✅ Entorno de simulación listo para k6"

      - name: Verificar health de servicios
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused -sf \
            http://localhost:8080/actuator/health | grep -q '"status":"UP"' \
            && echo "✅ microservice-a healthy" \
            || (echo "❌ microservice-a no responde"; exit 1)

      - name: Instalar k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q
          sudo apt-get install -yq k6

      - name: Ejecutar smoke test k6 (ruta crítica)
        run: |
          mkdir -p tests/k6/results
          k6 run \
            --env BASE_URL=${{ env.BASE_URL }} \
            --out json=tests/k6/results/smoke_summary.json \
            tests/k6/smoke_recarga.js

      - name: Publicar resultados k6
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results-${{ github.run_number }}
          path: tests/k6/results/
          retention-days: 30
          if-no-files-found: warn

      - name: Detener entorno de simulación
        if: always()
        working-directory: simulation
        run: docker compose down -v --remove-orphans


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 · UI TESTING (Selenium WebDriver – E2E sobre Angular UI)
  # Activar mediante variable de repositorio: UI_TESTS_ENABLED = true
  # ════════════════════════════════════════════════════════════════════════════
  ui-testing:
    name: "3 · UI Testing (Selenium)"
    runs-on: ubuntu-latest
    if: vars.UI_TESTS_ENABLED == 'true'

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login en GHCR (imágenes de simulación)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Iniciar entorno de simulación completo (incluye UI Angular)
        working-directory: simulation
        timeout-minutes: 10
        run: |
          docker compose up -d --build --wait
          echo "✅ UI disponible en http://localhost:4200"

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: maven

      - name: Instalar Chrome (para Selenium WebDriverManager)
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -yq google-chrome-stable

      - name: Ejecutar tests Selenium
        working-directory: tests/ui-selenium
        env:
          APP_URL: "http://localhost:4200"
        run: |
          mvn test \
            -Dapp.url=http://localhost:4200 \
            -q --no-transfer-progress

      - name: Publicar resultados Selenium
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-testing-results-${{ github.run_number }}
          path: |
            tests/ui-selenium/target/surefire-reports/
            tests/ui-selenium/target/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Detener entorno de simulación
        if: always()
        working-directory: simulation
        run: docker compose down -v --remove-orphans


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 · RPA – Automatización Salesforce (Python / Playwright)
  # Activar mediante variable de repositorio: RPA_ENABLED = true
  # Secrets requeridos: SF_URL, SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN
  # ════════════════════════════════════════════════════════════════════════════
  rpa:
    name: "4 · RPA Salesforce (Playwright)"
    runs-on: ubuntu-latest
    if: vars.RPA_ENABLED == 'true'

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias RPA
        working-directory: tests/rpa
        run: |
          pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          playwright install chromium --with-deps

      - name: Ejecutar automatización RPA Salesforce
        working-directory: tests/rpa
        env:
          SF_URL: ${{ secrets.SF_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          RPA_HEADLESS: "true"
          RPA_SLOW_MO: "0"
          SCREENSHOT_DIR: "screenshots"
        run: python main.py

      - name: Publicar evidencias RPA (screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpa-evidencias-${{ github.run_number }}
          path: tests/rpa/screenshots/
          retention-days: 30
          if-no-files-found: warn


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 · QUALITY GATE — Evaluación consolidada
  # Bloquea el pipeline si API Testing o Performance fallan.
  # UI Testing y RPA son informativos (no bloquean) en esta PoC.
  # ════════════════════════════════════════════════════════════════════════════
  quality-gate:
    name: "5 · Quality Gate"
    runs-on: ubuntu-latest
    needs: [api-testing, performance, ui-testing, rpa]
    if: always()

    steps:
      - name: Evaluar resultado — API Testing (BLOQUEANTE)
        env:
          RESULT: ${{ needs.api-testing.result }}
        run: |
          echo "API Testing result: ${RESULT}"
          if [ "${RESULT}" = "failure" ]; then
            echo "❌ QUALITY GATE FALLÓ: API Testing no pasó los checks"
            exit 1
          fi

      - name: Evaluar resultado — Performance Testing (BLOQUEANTE)
        env:
          RESULT: ${{ needs.performance.result }}
        run: |
          echo "Performance result: ${RESULT}"
          if [ "${RESULT}" = "failure" ]; then
            echo "❌ QUALITY GATE FALLÓ: Performance Testing no pasó los thresholds"
            exit 1
          fi

      - name: Evaluar resultado — UI Testing (INFORMATIVO)
        env:
          RESULT: ${{ needs.ui-testing.result }}
        run: |
          case "${RESULT}" in
            success) echo "✅ UI Testing: OK" ;;
            skipped) echo "ℹ️  UI Testing: omitido (UI_TESTS_ENABLED no activo)" ;;
            failure) echo "⚠️  UI Testing: falló — revisar artefactos" ;;
            *)       echo "ℹ️  UI Testing: ${RESULT}" ;;
          esac

      - name: Evaluar resultado — RPA (INFORMATIVO)
        env:
          RESULT: ${{ needs.rpa.result }}
        run: |
          case "${RESULT}" in
            success) echo "✅ RPA Salesforce: OK" ;;
            skipped) echo "ℹ️  RPA: omitido (RPA_ENABLED no activo)" ;;
            failure) echo "⚠️  RPA: falló — revisar evidencias en artefactos" ;;
            *)       echo "ℹ️  RPA: ${RESULT}" ;;
          esac

      - name: Resumen Quality Gate
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  AT&T PoC QA — Quality Gate Superado ✅"
          echo "═══════════════════════════════════════════"
          echo "  · API Testing   : ${{ needs.api-testing.result }}"
          echo "  · Performance   : ${{ needs.performance.result }}"
          echo "  · UI Testing    : ${{ needs.ui-testing.result }}"
          echo "  · RPA Salesforce: ${{ needs.rpa.result }}"
          echo "  · Rama          : ${{ github.ref_name }}"
          echo "  · Commit        : ${{ github.sha }}"
          echo "═══════════════════════════════════════════"
