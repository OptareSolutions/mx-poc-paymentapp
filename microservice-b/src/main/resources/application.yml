spring:
  application:
    name: paymentbox-customer-profile
  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:att_paymentbox}
    username: ${DB_USER:att_user}
    password: ${DB_PASS:att_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: FRAMEWORK

# ── Solo Actuator (patrón PoC) ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ── Resilience4j: Circuit Breaker + Retry ─────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 50
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
    instances:
      customerLookup:
        baseConfig: default
  retry:
    instances:
      customerLookup:
        maxAttempts: 3
        waitDuration: 2s

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging estructurado ──────────────────────────────────────────────────────
logging:
  file:
    name: ${LOG_FILE_NAME:paymentbox-customer-profile.log}
    path: ${LOG_FILE_PATH:/tmp/logs}
