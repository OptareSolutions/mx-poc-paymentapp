// ─────────────────────────────────────────────────────────────────────────────
// DEPRECATED — Reemplazado por pom.xml (Maven)
// Migración: Java 17 → 21 · Spring Boot 3.2.5 → 3.5.3 · Gradle → Maven
// Este archivo ya NO es utilizado por el pipeline (pipeline-microservice-b.yml).
// Conservado como referencia histórica. Usar pom.xml para todos los builds.
// ─────────────────────────────────────────────────────────────────────────────
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'com.att.paymentbox'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'com.h2database:h2'
}

jacoco {
    toolVersion = '0.8.11'
}

def jacocoExclusions = [
    '**/model/**', '**/config/**', '**/CustomerProfileApplication.class', '**/*$*'
]

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExclusions)
    }))
    reports { xml.required = true; html.required = true }
}

jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExclusions)
    }))
    violationRules {
        rule { limit { minimum = 0.80 } }
    }
}
